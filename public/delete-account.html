<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>刪除帳號</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 { font-size: 20px; color: #333; margin-bottom: 8px; }
    .email { color: #666; font-size: 14px; margin-bottom: 32px; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-danger { background: #e53e3e; color: white; }
    .btn-login { background: #3182ce; color: white; text-decoration: none; display: inline-block; }
    .msg { margin-top: 16px; font-size: 14px; padding: 12px; border-radius: 8px; }
    .msg-ok { background: #f0fff4; color: #276749; }
    .msg-err { background: #fff5f5; color: #c53030; }
    .not-logged-in { color: #666; }
    .not-logged-in a { color: #3182ce; }
  </style>
</head>
<body>
  <div class="card" id="app">
    <div id="loading">載入中...</div>
  </div>
  <script>
    const app = document.getElementById('app');

    async function init() {
      try {
        const res = await fetch('/api/v1/auth/me', { credentials: 'include' });
        const data = await res.json();

        if (!res.ok || !data.success || !data.data?.user) {
          app.innerHTML = `
            <h1>尚未登入</h1>
            <p class="not-logged-in">請先到 <a href="/" target="_blank">島島</a> 登入後再回來</p>
          `;
          return;
        }

        const user = data.data.user;
        app.innerHTML = `
          <h1>${user.nickname || user.name || '使用者'}</h1>
          <p class="email">${user.email || ''}</p>
          <button class="btn btn-danger" id="deleteBtn">刪除我的帳號</button>
          <div id="msg"></div>
        `;

        document.getElementById('deleteBtn').addEventListener('click', deleteAccount);
      } catch {
        app.innerHTML = '<h1>無法連線</h1><p class="not-logged-in">請確認伺服器正在執行</p>';
      }
    }

    async function deleteAccount() {
      const btn = document.getElementById('deleteBtn');
      const msg = document.getElementById('msg');

      if (!confirm('確定要刪除帳號嗎？所有資料將被永久刪除。')) return;

      btn.disabled = true;
      btn.textContent = '刪除中...';

      try {
        const res = await fetch('/api/v1/users/me', {
          method: 'DELETE',
          credentials: 'include'
        });
        const data = await res.json();

        if (res.ok && data.success) {
          app.innerHTML = `
            <h1>帳號已刪除</h1>
            <p class="email" style="margin-bottom:16px">可以用同一個 Google 帳號重新註冊了</p>
            <a class="btn btn-login" href="/">前往首頁</a>
          `;
        } else {
          msg.className = 'msg msg-err';
          msg.textContent = data.error?.message || '刪除失敗';
          btn.disabled = false;
          btn.textContent = '刪除我的帳號';
        }
      } catch {
        msg.className = 'msg msg-err';
        msg.textContent = '網路錯誤，請重試';
        btn.disabled = false;
        btn.textContent = '刪除我的帳號';
      }
    }

    init();
  </script>
</body>
</html>

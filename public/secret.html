<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帳號管理</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      font-size: 20px;
      color: #333;
      margin-bottom: 8px;
    }

    .email {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-bottom: 12px;
    }

    .btn:last-child {
      margin-bottom: 0;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #3182ce;
      color: white;
    }

    .btn-secondary {
      background: #718096;
      color: white;
    }

    .btn-danger {
      background: #e53e3e;
      color: white;
    }

    .btn-login {
      background: #3182ce;
      color: white;
      text-decoration: none;
      display: inline-block;
    }

    .divider {
      border-top: 1px solid #e2e8f0;
      margin: 20px 0;
      position: relative;
    }

    .divider::after {
      content: '危險區域';
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 0 12px;
      color: #a0aec0;
      font-size: 12px;
    }

    .msg {
      margin-top: 16px;
      font-size: 14px;
      padding: 12px;
      border-radius: 8px;
    }

    .msg-ok {
      background: #f0fff4;
      color: #276749;
    }

    .msg-err {
      background: #fff5f5;
      color: #c53030;
    }

    .not-logged-in {
      color: #666;
    }

    .not-logged-in a {
      color: #3182ce;
    }
  </style>
</head>

<body>
  <div class="card" id="app">
    <div id="loading">載入中...</div>
  </div>
  <script>
    const app = document.getElementById('app');

    async function init() {
      try {
        const res = await fetch('/api/v1/auth/me', { credentials: 'include' });
        const data = await res.json();

        if (!res.ok || !data.success || !data.data?.user) {
          app.innerHTML = `
            <h1>尚未登入</h1>
            <p class="not-logged-in" style="margin-bottom: 24px">請先登入後再進行帳號管理</p>
            <a class="btn btn-primary" href="/api/v1/auth/google" style="text-decoration: none; display: block;">使用 Google 登入</a>
          `;
          return;
        }

        const user = data.data.user;
        app.innerHTML = `
          <h1>${user.nickname || user.name || '使用者'}</h1>
          <p class="email">${user.email || ''}</p>
          <button class="btn btn-primary" id="switchBtn">換帳號登入</button>
          <button class="btn btn-secondary" id="logoutBtn">登出</button>
          <div class="divider"></div>
          <button class="btn btn-danger" id="deleteBtn">刪除我的帳號</button>
          <div id="msg"></div>
        `;

        document.getElementById('switchBtn').addEventListener('click', switchAccount);
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.getElementById('deleteBtn').addEventListener('click', deleteAccount);
      } catch {
        app.innerHTML = '<h1>無法連線</h1><p class="not-logged-in">請確認伺服器正在執行</p>';
      }
    }

    async function logout() {
      const btn = document.getElementById('logoutBtn');
      btn.disabled = true;
      btn.textContent = '登出中...';

      try {
        await fetch('/api/v1/auth/logout', {
          method: 'POST',
          credentials: 'include'
        });
        app.innerHTML = `
          <h1>已登出</h1>
          <p class="email" style="margin-bottom:16px">您已成功登出</p>
          <a class="btn btn-primary" href="/api/v1/auth/google" style="text-decoration: none; display: block;">重新登入</a>
        `;
      } catch {
        btn.disabled = false;
        btn.textContent = '登出';
        showMessage('登出失敗，請重試', true);
      }
    }

    async function switchAccount() {
      const btn = document.getElementById('switchBtn');
      btn.disabled = true;
      btn.textContent = '切換中...';

      try {
        await fetch('/api/v1/auth/logout', {
          method: 'POST',
          credentials: 'include'
        });
        // 登出後直接跳轉到 Google 登入
        window.location.href = '/api/v1/auth/google';
      } catch {
        btn.disabled = false;
        btn.textContent = '換帳號登入';
        showMessage('操作失敗，請重試', true);
      }
    }

    async function deleteAccount() {
      const btn = document.getElementById('deleteBtn');

      if (!confirm('確定要刪除帳號嗎？所有資料將被永久刪除。')) return;

      btn.disabled = true;
      btn.textContent = '刪除中...';

      try {
        const res = await fetch('/api/v1/users/me', {
          method: 'DELETE',
          credentials: 'include'
        });
        const data = await res.json();

        if (res.ok && data.success) {
          app.innerHTML = `
            <h1>帳號已刪除</h1>
            <p class="email" style="margin-bottom:16px">可以用同一個 Google 帳號重新註冊了</p>
            <a class="btn btn-primary" href="https://dev.daodao.so" style="text-decoration: none; display: block;">前往首頁</a>
          `;
        } else {
          showMessage(data.error?.message || '刪除失敗', true);
          btn.disabled = false;
          btn.textContent = '刪除我的帳號';
        }
      } catch {
        showMessage('網路錯誤，請重試', true);
        btn.disabled = false;
        btn.textContent = '刪除我的帳號';
      }
    }

    function showMessage(text, isError) {
      const msg = document.getElementById('msg');
      if (msg) {
        msg.className = isError ? 'msg msg-err' : 'msg msg-ok';
        msg.textContent = text;
      }
    }

    init();
  </script>
</body>

</html>

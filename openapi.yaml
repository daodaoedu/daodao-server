paths:
  /api/v1/auth/login:
    post:
      summary: 用戶登入（暫不支援）
      description: 密碼登入功能暫時不可用，請使用 Google OAuth 登入
      tags:
        - Authentication
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "401":
          description: 功能暫不支援，請使用 Google 登入
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
                example:
                  success: false
                  error:
                    type: unauthorized
                    message: 請使用 Google 登入
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/register:
    post:
      summary: 用戶註冊（暫不支援）
      description: 註冊功能暫時不可用，請使用 Google OAuth 登入
      tags:
        - Authentication
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "400":
          description: 功能暫不支援，請使用 Google 登入
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
                example:
                  success: false
                  error:
                    type: bad_request
                    message: 註冊功能暫時不可用，請使用 Google 登入
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/logout:
    post:
      summary: 用戶登出
      description: 登出當前用戶（客戶端需要刪除本地 token）
      tags:
        - Authentication
      security:
        - BearerAuth: []
        - SessionAuth: []
      responses:
        "200":
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/refresh:
    post:
      summary: 刷新認證令牌
      description: 使用現有的 JWT token 生成新的 token
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 令牌刷新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/forgot-password:
    post:
      summary: 請求密碼重設（暫不支援）
      description: 密碼重設功能暫時不可用，請使用 Google OAuth 登入
      tags:
        - Authentication
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "400":
          description: 功能暫不支援，請使用 Google 登入
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/reset-password:
    post:
      summary: 確認密碼重設（暫不支援）
      description: 密碼重設功能暫時不可用，請使用 Google OAuth 登入
      tags:
        - Authentication
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "400":
          description: 功能暫不支援，請使用 Google 登入
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/verify-email:
    post:
      summary: 驗證電子郵件
      description: 使用驗證令牌確認用戶的電子郵件地址
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: 電子郵件驗證成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/google:
    get:
      summary: 開始 Google OAuth 認證
      description: 重定向到 Google OAuth 授權頁面
      tags:
        - OAuth
      responses:
        "302":
          description: 重定向到 Google OAuth 授權頁面
          headers:
            Location:
              description: Google OAuth 授權 URL
              schema:
                type: string
                example: https://accounts.google.com/oauth/authorize?...
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/google/callback:
    get:
      summary: Google OAuth 回調
      description: 處理 Google OAuth 認證回調，完成用戶認證
      tags:
        - OAuth
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
          description: Google OAuth 授權碼
          example: 4/0AX4XfWi...
        - in: query
          name: state
          schema:
            type: string
          description: 狀態參數（防止 CSRF 攻擊）
          example: random-state-string
        - in: query
          name: error
          schema:
            type: string
          description: 錯誤代碼（當授權失敗時）
          example: access_denied
      responses:
        "302":
          description: 認證成功，重定向到前端應用
          headers:
            Location:
              description: 重定向 URL，包含認證令牌
              schema:
                type: string
                example: https://app.example.com/dashboard?token=eyJ...
        "401":
          description: Google OAuth 認證失敗
          headers:
            Location:
              description: 重定向到失敗頁面
              schema:
                type: string
                example: https://app.example.com/auth/failure
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/auth/google/failure:
    get:
      summary: Google OAuth 認證失敗
      description: 當 Google OAuth 認證失敗時的處理端點
      tags:
        - OAuth
      responses:
        "401":
          description: Google OAuth 認證失敗
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Google 認證失敗
                  error:
                    type: string
                    description: 詳細錯誤資訊
                    example: OAuth authentication was cancelled by user
  /api/v1/comments:
    post:
      summary: 建立評論
      description: 為指定的目標實體建立新評論，支援回覆功能
      tags:
        - Comments
      security:
        - BearerAuth: []
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreateRequest"
            examples:
              createRootComment:
                summary: 建立根評論
                value:
                  targetType: post
                  targetId: "123"
                  content: 這是一個很有用的資源，謝謝分享！
                  visibility: public
              createReply:
                summary: 建立回覆評論（資源使用 UUID）
                value:
                  targetType: resource
                  targetId: uuid-abc-123-def-456
                  content: 我同意你的觀點，這確實很有幫助。
                  visibility: private
                  parentId: 789
              createCircleComment:
                summary: 建立圈子評論（使用 UUID）
                value:
                  targetType: circle
                  targetId: uuid-circle-789-ghi-012
                  content: 這個圈子的討論很有意思！
                  visibility: public
      responses:
        "201":
          description: 評論建立成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentCreateResponse"
              example:
                success: true
                message: 評論建立成功
                data:
                  id: 789
                  userId: 1
                  targetId: "123"
                  targetType: post
                  content: 這是一個很有用的資源，謝謝分享！
                  visibility: public
                  createdAt: "2024-01-15T10:30:00Z"
                  updatedAt: "2024-01-15T10:30:00Z"
                  parent_id: null
                  user:
                    id: 1
                    name: 張三
                    _id: 507f1f77bcf86cd799439011
                    roleList:
                      - user
                    photoURL: https://example.com/avatar.jpg
                  replies: []
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: 目標實體或父評論不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                success: false
                message: 目標實體不存在
                error: TARGET_NOT_FOUND
        "409":
          description: 業務邏輯衝突（如父評論不屬於同一目標）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                success: false
                message: 父評論必須屬於同一目標實體
                error: INVALID_PARENT_COMMENT
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      summary: 獲取評論列表
      description: 根據目標類型和 ID 獲取評論列表，包含嵌套回覆結構
      tags:
        - Comments
      parameters:
        - in: query
          name: targetType
          required: true
          schema:
            type: string
            enum:
              - post
              - resource
              - note
              - outcome
              - review
              - circle
              - idea
              - portfolio
          description: 目標實體類型
          example: post
        - in: query
          name: targetId
          required: true
          schema:
            type: string
          description: 目標實體 ID
          example: "123"
      responses:
        "200":
          description: 成功獲取評論列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentListResponse"
              example:
                success: true
                data:
                  - id: 789
                    userId: 1
                    targetId: "123"
                    targetType: post
                    content: 這是一個根評論
                    visibility: public
                    createdAt: "2024-01-15T10:30:00Z"
                    updatedAt: "2024-01-15T10:30:00Z"
                    parent_id: null
                    user:
                      id: 1
                      name: 張三
                      _id: 507f1f77bcf86cd799439011
                      roleList:
                        - user
                      photoURL: https://example.com/avatar.jpg
                    replies:
                      - id: 790
                        userId: 2
                        targetId: "123"
                        targetType: post
                        content: 這是一個回覆
                        visibility: public
                        createdAt: "2024-01-15T11:00:00Z"
                        updatedAt: "2024-01-15T11:00:00Z"
                        parent_id: 789
                        user:
                          id: 2
                          name: 李四
                          _id: 507f1f77bcf86cd799439012
                          roleList:
                            - user
                          photoURL: null
                        replies: []
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          description: 目標實體不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                success: false
                message: 目標實體不存在
                error: TARGET_NOT_FOUND
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/comments/{commentId}:
    get:
      summary: 獲取評論詳情
      description: 根據評論 ID 獲取單個評論的詳細資訊，包含回覆
      tags:
        - Comments
      parameters:
        - in: path
          name: commentId
          required: true
          schema:
            type: integer
            minimum: 1
          description: 評論 ID
          example: 789
      responses:
        "200":
          description: 成功獲取評論詳情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentDetailResponse"
              example:
                success: true
                data:
                  id: 789
                  userId: 1
                  targetId: uuid-string-123
                  targetType: resource
                  content: 這是評論內容
                  visibility: public
                  createdAt: "2024-01-15T10:30:00Z"
                  updatedAt: "2024-01-15T10:30:00Z"
                  parent_id: null
                  user:
                    id: 1
                    name: 張三
                    _id: 507f1f77bcf86cd799439011
                    roleList:
                      - user
                    photoURL: https://example.com/avatar.jpg
                  replies: []
        "400":
          $ref: "#/components/responses/BadRequestError"
        "403":
          description: 無權限查看此評論
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                success: false
                message: 無權限查看此評論
                error: PERMISSION_DENIED
        "404":
          description: 評論不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                success: false
                message: 評論不存在
                error: COMMENT_NOT_FOUND
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: 更新評論
      description: 更新指定評論的內容或可見性設定，僅評論作者可操作
      tags:
        - Comments
      security:
        - BearerAuth: []
        - SessionAuth: []
      parameters:
        - in: path
          name: commentId
          required: true
          schema:
            type: integer
            minimum: 1
          description: 評論 ID
          example: 789
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentUpdateRequest"
            examples:
              updateContent:
                summary: 更新評論內容
                value:
                  content: 更新後的評論內容
              updateVisibility:
                summary: 更新可見性
                value:
                  visibility: private
              updateBoth:
                summary: 同時更新內容和可見性
                value:
                  content: 更新後的評論內容
                  visibility: public
      responses:
        "200":
          description: 評論更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentUpdateResponse"
              example:
                success: true
                message: 評論更新成功
                data:
                  id: 789
                  userId: 1
                  targetId: "456"
                  targetType: idea
                  content: 更新後的評論內容
                  visibility: public
                  createdAt: "2024-01-15T10:30:00Z"
                  updatedAt: "2024-01-15T12:00:00Z"
                  parent_id: null
                  user:
                    id: 1
                    name: 張三
                    _id: 507f1f77bcf86cd799439011
                    roleList:
                      - user
                    photoURL: https://example.com/avatar.jpg
                  replies: []
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: 無權限編輯此評論
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                success: false
                message: 只有評論作者可以編輯評論
                error: PERMISSION_DENIED
        "404":
          description: 評論不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                success: false
                message: 評論不存在
                error: COMMENT_NOT_FOUND
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: 刪除評論
      description: 刪除指定的評論，僅評論作者可操作。刪除父評論時會同時刪除所有子評論
      tags:
        - Comments
      security:
        - BearerAuth: []
        - SessionAuth: []
      parameters:
        - in: path
          name: commentId
          required: true
          schema:
            type: integer
            minimum: 1
          description: 評論 ID
          example: 789
      responses:
        "200":
          description: 評論刪除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentDeleteResponse"
              example:
                success: true
                message: 評論刪除成功
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: 無權限刪除此評論
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                success: false
                message: 只有評論作者可以刪除評論
                error: PERMISSION_DENIED
        "404":
          description: 評論不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                success: false
                message: 評論不存在
                error: COMMENT_NOT_FOUND
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/health:
    get:
      summary: API 健康檢查
      tags:
        - System
      responses:
        "200":
          description: API 運行正常
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - timestamp
                properties:
                  status:
                    type: string
                    example: OK
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-01-15T10:30:00Z"
                  uptime:
                    type: number
                    description: 系統運行時間（秒）
                    example: 86400
                  database:
                    type: object
                    properties:
                      status:
                        type: string
                        example: connected
                      responseTime:
                        type: number
                        description: 資料庫響應時間（毫秒）
                        example: 12
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/info:
    get:
      summary: API 版本資訊
      tags:
        - System
      responses:
        "200":
          description: 成功獲取 API 資訊
          content:
            application/json:
              schema:
                type: object
                required:
                  - name
                  - version
                  - description
                properties:
                  name:
                    type: string
                    example: DaoDao 資源管理 API
                  version:
                    type: string
                    example: 1.0.0
                  description:
                    type: string
                    example: 提供資源管理、心得評價和標籤功能的 RESTful API
                  environment:
                    type: string
                    example: development
                  node_version:
                    type: string
                    example: 18.17.0
                  database:
                    type: object
                    properties:
                      type:
                        type: string
                        example: PostgreSQL
                      version:
                        type: string
                        example: "14.9"
                  features:
                    type: array
                    items:
                      type: string
                    example:
                      - 資源管理
                      - 心得評價
                      - 標籤系統
                      - 分頁查詢
                      - 全文搜索
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/db-info:
    get:
      summary: 取得資料庫結構資訊
      description: 返回 MongoDB 和 PostgreSQL 的資料庫結構資訊
      tags:
        - Database Info
      responses:
        "200":
          description: 成功取得資料庫資訊
          content:
            application/json:
              schema:
                type: object
                properties:
                  mongo:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        fields:
                          type: array
                          items:
                            type: string
                          description: 集合欄位列表
                    description: MongoDB 集合資訊
                  postgres:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        columns:
                          type: array
                          items:
                            type: object
                            properties:
                              column_name:
                                type: string
                                description: 欄位名稱
                              data_type:
                                type: string
                                description: 資料類型
                    description: PostgreSQL 表格資訊
              example:
                mongo:
                  users:
                    fields:
                      - _id
                      - email
                      - createdAt
                      - updatedAt
                  resources:
                    fields:
                      - _id
                      - title
                      - type
                      - tags
                      - createdAt
                postgres:
                  users:
                    columns:
                      - column_name: user_id
                        data_type: uuid
                      - column_name: email
                        data_type: character varying
                  projects:
                    columns:
                      - column_name: project_id
                        data_type: uuid
                      - column_name: name
                        data_type: character varying
        "500":
          description: 伺服器錯誤
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

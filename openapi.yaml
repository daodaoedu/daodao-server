openapi: 3.0.0
info:
  title: DaoDao 資源管理 API
  version: 1.0.0
  description: 提供資源管理、心得評價和標籤功能的 RESTful API
  contact:
    name: DaoDao 開發團隊
    email: support@daodao.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:4000
    description: 本機開發
  - url: https://server.daoedu.tw/
    description: 開發環境
  - url: https://dao-server.daoedu.tw/
    description: 生產環境
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 使用 JWT Token 進行身份驗證
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT 認證令牌，格式：Bearer {token}
    SessionAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session 認證，基於 cookie
  parameters:
    idParam:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: 資源的唯一識別碼 (UUID)
      example: 123e4567-e89b-12d3-a456-426614174000
    reviewIdParam:
      in: path
      name: id
      required: true
      schema:
        type: string
        pattern: ^[1-9]\d*$
      description: 評論的唯一識別碼（字串格式的數字）
      example: "1"
    resourceIdParam:
      in: path
      name: resourceId
      required: true
      schema:
        type: string
        format: uuid
      description: 資源的唯一識別碼 (UUID)
      example: 123e4567-e89b-12d3-a456-426614174000
    cursorParam:
      in: query
      name: cursor
      required: false
      schema:
        type: string
      description: 游標，用於游標分頁
    limitParam:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: 每頁返回的記錄數
    resourceLimitParam:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 5
      description: 每頁返回的資源數
    reviewLimitParam:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10
        default: 2
      description: 每頁返回的評論數
    sortParam:
      in: query
      name: sort
      required: false
      schema:
        type: string
        enum:
          - id
          - name
          - created_at
          - updated_at
      description: 排序欄位
    orderParam:
      in: query
      name: order
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
      description: 排序方向
    pageParam:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 頁數
    pageSizeParam:
      in: query
      name: pageSize
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: 每頁項目數
  responses:
    BadRequestError:
      description: 請求參數錯誤
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
            allOf:
              - $ref: "#/components/schemas/ApiErrorResponse"
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        example: BAD_REQUEST
                      message:
                        example: 請求參數錯誤
    UnauthorizedError:
      description: 未授權存取
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
            allOf:
              - $ref: "#/components/schemas/ApiErrorResponse"
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        example: UNAUTHORIZED
                      message:
                        example: 未授權存取
    ForbiddenError:
      description: 禁止存取
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
            allOf:
              - $ref: "#/components/schemas/ApiErrorResponse"
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        example: FORBIDDEN
                      message:
                        example: 無權限執行此操作
    NotFoundError:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
            allOf:
              - $ref: "#/components/schemas/ApiErrorResponse"
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        example: NOT_FOUND
                      message:
                        example: 資源不存在
    ConflictError:
      description: 資源衝突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
            allOf:
              - $ref: "#/components/schemas/ApiErrorResponse"
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        example: CONFLICT
                      message:
                        example: 資源已存在或發生衝突
    InternalServerError:
      description: 伺服器內部錯誤
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
            allOf:
              - $ref: "#/components/schemas/ApiErrorResponse"
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        example: INTERNAL_SERVER_ERROR
                      message:
                        example: 伺服器內部錯誤
    ValidationError:
      description: 資料驗證錯誤
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiErrorResponse"
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        example: VALIDATION_ERROR
                      message:
                        example: 資料驗證失敗
                      details:
                        type: object
                        example:
                          title: 標題不能為空
                          email: 信箱格式錯誤
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: 用戶電子郵件
          example: user@example.com
        password:
          type: string
          format: password
          description: 用戶密碼
          example: securePassword123
        rememberMe:
          type: boolean
          description: 記住我選項
          default: false
          example: false
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
        - confirmPassword
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          description: 用戶名
          example: john_doe
        email:
          type: string
          format: email
          description: 電子郵件
          example: john@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: 密碼
          example: securePassword123
        confirmPassword:
          type: string
          format: password
          description: 確認密碼
          example: securePassword123
        name:
          type: string
          description: 顯示名稱
          example: John Doe
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: 用戶電子郵件
          example: user@example.com
    ResetPasswordRequest:
      type: object
      required:
        - token
        - newPassword
        - confirmPassword
      properties:
        token:
          type: string
          description: 密碼重設令牌
          example: reset-token-uuid
        newPassword:
          type: string
          format: password
          minLength: 8
          description: 新密碼
          example: newSecurePassword123
        confirmPassword:
          type: string
          format: password
          description: 確認新密碼
          example: newSecurePassword123
    VerifyEmailRequest:
      type: object
      required:
        - token
        - email
      properties:
        token:
          type: string
          description: 郵件驗證令牌
          example: verify-token-uuid
        email:
          type: string
          format: email
          description: 用戶電子郵件
          example: user@example.com
    AuthSuccessData:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: 響應訊息
          example: 登入成功
        token:
          type: string
          description: JWT 認證令牌
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: "#/components/schemas/UserProfile"
        isTemporary:
          type: boolean
          description: 是否為臨時用戶
          example: false
        redirectUrl:
          type: string
          description: 重定向 URL
          example: https://app.example.com/dashboard
    AuthResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AuthSuccessData"
    UserProfile:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          description: 用戶 ID
          example: 1
        username:
          type: string
          description: 用戶名
          example: john_doe
        email:
          type: string
          format: email
          description: 電子郵件
          example: john@example.com
        name:
          type: string
          description: 顯示名稱
          example: John Doe
        photoUrl:
          type: string
          nullable: true
          description: 頭像 URL
          example: https://example.com/avatar.jpg
        isActive:
          type: boolean
          description: 帳號是否啟用
          example: true
        emailVerified:
          type: boolean
          description: 電子郵件是否已驗證
          example: true
        createdAt:
          type: string
          format: date-time
          description: 建立時間
          example: "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: 更新時間
          example: "2024-01-15T10:30:00Z"
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
          description: 最後登入時間
          example: "2024-01-15T09:15:00Z"
    TempUserProfile:
      type: object
      required:
        - id
        - email
        - name
      properties:
        id:
          type: integer
          description: 臨時用戶 ID
          example: 1
        email:
          type: string
          format: email
          description: 電子郵件
          example: temp@example.com
        name:
          type: string
          description: 顯示名稱
          example: Temp User
        photoUrl:
          type: string
          nullable: true
          description: 頭像 URL
          example: https://example.com/avatar.jpg
        googleId:
          type: string
          description: Google OAuth ID
          example: google-oauth-id
        isVerified:
          type: boolean
          description: 是否已驗證
          example: false
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: 過期時間
          example: "2024-01-22T10:30:00Z"
        createdAt:
          type: string
          format: date-time
          description: 建立時間
          example: "2024-01-15T10:30:00Z"
    CommentCreateRequest:
      type: object
      required:
        - targetType
        - targetId
        - content
      properties:
        targetType:
          type: string
          enum:
            - post
            - resource
            - note
            - outcome
            - review
            - circle
            - idea
            - portfolio
          description: 評論目標類型
          example: post
        targetId:
          type: string
          description: 目標實體 ID
          example: "123"
        content:
          type: string
          minLength: 1
          maxLength: 5000
          description: 評論內容
          example: 這是一個很有用的資源，謝謝分享！
        visibility:
          type: string
          enum:
            - public
            - private
          default: private
          description: 評論可見性
          example: public
        parentId:
          type: integer
          minimum: 1
          nullable: true
          description: 父評論 ID（用於回覆）
          example: 456
    CommentUpdateRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 5000
          description: 更新的評論內容
          example: 更新後的評論內容
        visibility:
          type: string
          enum:
            - public
            - private
          description: 更新的可見性設定
          example: private
    CommentUser:
      type: object
      required:
        - id
        - name
        - _id
        - roleList
      properties:
        id:
          type: integer
          description: 使用者 ID
          example: 1
        name:
          type: string
          description: 使用者名稱
          example: 張三
        _id:
          type: string
          description: 使用者 UUID
          example: 507f1f77bcf86cd799439011
        roleList:
          type: array
          description: 使用者角色列表
          items:
            type: string
          example:
            - user
            - participant
        photoURL:
          type: string
          nullable: true
          description: 使用者頭像 URL
          example: https://example.com/avatar.jpg
    CommentResponse:
      type: object
      required:
        - id
        - userId
        - targetId
        - targetType
        - content
        - visibility
        - createdAt
        - updatedAt
        - parentId
        - user
        - replies
      properties:
        id:
          type: integer
          description: 評論 ID
          example: 789
        userId:
          type: integer
          description: 評論作者 ID
          example: 1
        targetId:
          type: string
          description: 目標實體的外部 ID（UUID 或數字字串）
          example: uuid-string-123
        targetType:
          type: string
          enum:
            - post
            - resource
            - note
            - outcome
            - review
            - circle
            - idea
            - portfolio
          description: 目標實體類型
          example: resource
        content:
          type: string
          description: 評論內容
          example: 這是一個很有用的資源，謝謝分享！
        visibility:
          type: string
          enum:
            - public
            - private
          description: 評論可見性
          example: public
        createdAt:
          type: string
          format: date-time
          description: 建立時間
          example: "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: 更新時間
          example: "2024-01-15T10:30:00Z"
        parentId:
          type: integer
          nullable: true
          description: 父評論 ID
          example: null
        user:
          $ref: "#/components/schemas/CommentUser"
        replies:
          type: array
          description: 子評論列表
          items:
            $ref: "#/components/schemas/CommentResponse"
          example: []
    CommentListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessResponse"
        - type: object
          properties:
            data:
              type: array
              description: 評論列表
              items:
                $ref: "#/components/schemas/CommentResponse"
    CommentDetailResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CommentResponse"
    CommentCreateResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessResponse"
        - type: object
          properties:
            message:
              example: 評論建立成功
            data:
              $ref: "#/components/schemas/CommentResponse"
    CommentUpdateResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessResponse"
        - type: object
          properties:
            message:
              example: 評論更新成功
            data:
              $ref: "#/components/schemas/CommentResponse"
    CommentDeleteResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessResponse"
        - type: object
          properties:
            message:
              example: 評論刪除成功
    ApiErrorResponse:
      type: object
      required:
        - success
        - data
        - error
        - timestamp
      properties:
        success:
          type: boolean
          description: 請求是否成功
          example: false
        data:
          type: "null"
          description: 錯誤時資料為 null
          example: null
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: 錯誤代碼
              example: INVALID_REQUEST
            message:
              type: string
              description: 錯誤訊息
              example: 請求參數錯誤
            details:
              type: object
              additionalProperties:
                type: string
              description: 詳細錯誤資訊
              example:
                field: email
                reason: 格式不正確
        timestamp:
          type: string
          format: date-time
          description: 時間戳
          example: "2024-01-15T10:30:00Z"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
          nullable: true
    ApiSuccessResponse:
      type: object
      required:
        - success
        - data
        - timestamp
      properties:
        success:
          type: boolean
          description: 請求是否成功
          example: true
        data:
          description: 成功時的資料內容
          example:
            id: 1
            name: 範例資料
        timestamp:
          type: string
          format: date-time
          description: 時間戳
          example: "2024-01-15T10:30:00Z"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
          nullable: true
    PaginationInfo:
      type: object
      required:
        - currentPage
        - totalPages
        - totalItems
        - itemsPerPage
        - hasNext
        - hasPrev
      properties:
        currentPage:
          type: integer
          minimum: 1
          description: 目前頁碼
          example: 2
        totalPages:
          type: integer
          minimum: 0
          description: 總頁數
          example: 10
        totalItems:
          type: integer
          minimum: 0
          description: 總項目數
          example: 150
        itemsPerPage:
          type: integer
          minimum: 1
          description: 每頁項目數
          example: 20
        hasNext:
          type: boolean
          description: 是否有下一頁
          example: true
        hasPrev:
          type: boolean
          description: 是否有上一頁
          example: true
    CursorPaginationInfo:
      type: object
      required:
        - cursors
        - hasMore
        - count
      properties:
        cursors:
          type: object
          required:
            - start
            - end
          properties:
            start:
              type: string
              nullable: true
              description: 開始游標
              example: eyJpZCI6MTAwfQ==
            end:
              type: string
              nullable: true
              description: 結束游標
              example: eyJpZCI6MTIwfQ==
        hasMore:
          type: boolean
          description: 是否有更多數據
          example: true
        count:
          type: integer
          minimum: 0
          description: 本次返回的項目數
          example: 20
    ResponseMeta:
      type: object
      properties:
        searchQuery:
          type: string
          description: 搜尋查詢
          example: JavaScript
        searchTime:
          type: number
          description: 搜尋耗時（毫秒）
          example: 45
        filters:
          type: object
          additionalProperties: true
          description: 應用的篩選條件
          example:
            category: tech
            status: active
        categoryCounts:
          type: object
          additionalProperties:
            type: integer
          description: 分類統計
          example:
            tech: 50
            design: 30
        aggregateData:
          type: object
          additionalProperties: true
          description: 聚合資料
        requestId:
          type: string
          description: 請求 ID
          example: req-12345
        cacheHit:
          type: boolean
          description: 是否命中快取
          example: true
        processingTime:
          type: number
          description: 處理時間（毫秒）
          example: 123
    PaginatedApiResponse:
      type: object
      required:
        - success
        - data
        - pagination
        - timestamp
      properties:
        success:
          type: boolean
          description: 請求是否成功
          example: true
        data:
          type: array
          description: 分頁資料陣列
          items: {}
        pagination:
          $ref: "#/components/schemas/PaginationInfo"
        timestamp:
          type: string
          format: date-time
          description: 時間戳
          example: "2024-01-15T10:30:00Z"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
          nullable: true
    CursorPaginatedApiResponse:
      type: object
      required:
        - success
        - data
        - pagination
        - timestamp
      properties:
        success:
          type: boolean
          description: 請求是否成功
          example: true
        data:
          type: array
          description: 分頁資料陣列
          items: {}
        pagination:
          $ref: "#/components/schemas/CursorPaginationInfo"
        timestamp:
          type: string
          format: date-time
          description: 時間戳
          example: "2024-01-15T10:30:00Z"
        meta:
          $ref: "#/components/schemas/ResponseMeta"
          nullable: true
    Timestamps:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
          description: 建立時間
          example: "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: 更新時間
          example: "2024-01-15T10:30:00Z"
    UserBasicInfo:
      type: object
      description: 使用者基本資訊
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: 使用者 ID
          example: 1
        name:
          type: string
          description: 使用者名稱
          example: 張三
        _id:
          type: string
          description: 使用者 UUID
          example: 507f1f77bcf86cd799439011
        roleList:
          type: array
          description: 角色列表
          items:
            type: string
          example:
            - user
        photoURL:
          type: string
          nullable: true
          description: 頭像 URL
          example: https://example.com/avatar.jpg
        educationStage:
          type: string
          nullable: true
          description: 教育階段
          example: bachelor
        tagList:
          type: array
          description: 使用者標籤列表
          items:
            type: string
          example:
            - developer
            - student
        selfIntroduction:
          type: string
          nullable: true
          description: 自我介紹
          example: 我是一名熱愛學習的軟體開發者
    DatabaseColumn:
      type: object
      properties:
        columnName:
          type: string
          description: 欄位名稱
        dataType:
          type: string
          description: 資料類型
      required:
        - columnName
        - dataType
    PostgresTableInfo:
      type: object
      properties:
        columns:
          type: array
          items:
            $ref: "#/components/schemas/DatabaseColumn"
          description: 表格欄位資訊
      required:

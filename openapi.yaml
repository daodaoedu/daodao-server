            difficulty_level:
              - beginner
    CustomIdRequest:
      type: object
      required:
        - customId
      properties:
        customId:
          type: string
          pattern: ^[a-zA-Z0-9_-]{3,50}$
          description: 自訂 ID，3-50個字符，只能包含英文字母、數字、底線和連字符
          example: my_custom_id
    CustomIdAvailabilityResponse:
      type: object
      properties:
        available:
          type: boolean
          description: 自訂 ID 是否可用
          example: true
    CustomIdSetResponse:
      type: object
      properties:
        customId:
          type: string
          description: 設置的自訂 ID
          example: my_custom_id

    idParam:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: 資源的唯一識別碼 (UUID)
      example: 123e4567-e89b-12d3-a456-426614174000
    reviewIdParam:
      in: path
      name: id
      required: true
      schema:
        type: string
        pattern: ^[1-9]\d*$
      description: 評論的唯一識別碼（字串格式的數字）
      example: '1'
    resourceIdParam:
      in: path
      name: resourceId
      required: true
      schema:
        type: string
        format: uuid
      description: 資源的唯一識別碼 (UUID)
      example: 123e4567-e89b-12d3-a456-426614174000
    cursorParam:
      in: query
      name: cursor
      required: false
      schema:
        type: string
      description: 游標，用於游標分頁
    limitParam:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: 每頁返回的記錄數
    resourceLimitParam:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 5
      description: 每頁返回的資源數
    reviewLimitParam:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10
        default: 2
      description: 每頁返回的評論數
    sortParam:
      in: query
      name: sort
      required: false
      schema:
        type: string
        enum:
          - id
          - name
          - created_at
          - updated_at
      description: 排序欄位
    orderParam:
      in: query
      name: order
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
      description: 排序方向
    pageParam:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 頁數
    pageSizeParam:
      in: query
      name: pageSize
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: 每頁項目數
  responses:
    BadRequestError:
      description: 請求參數錯誤
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              data:
                type: 'null'
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: 輸入資料格式錯誤
                  details:
                    type: object
              timestamp:
                type: string
                format: date-time
    UnauthorizedError:
      description: 未授權，需要登入
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              data:
                type: 'null'
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: UNAUTHORIZED
                  message:
                    type: string
                    example: 請先登入
              timestamp:
                type: string
                format: date-time
    ForbiddenError:
      description: 禁止訪問，權限不足
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              data:
                type: 'null'
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: FORBIDDEN
                  message:
                    type: string
                    example: 權限不足
              timestamp:
                type: string
                format: date-time
    NotFoundError:
      description: 資源不存在
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              data:
                type: 'null'
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: NOT_FOUND
                  message:
                    type: string
                    example: 找不到指定的資源
              timestamp:
                type: string
                format: date-time
    ConflictError:
      description: 資源衝突
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              data:
                type: 'null'
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: CONFLICT
                  message:
                    type: string
                    example: 資源已存在或衝突
              timestamp:
                type: string
                format: date-time
    InternalServerError:
      description: 服務器內部錯誤
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              data:
                type: 'null'
              error:
                type: object
                properties:
                  code:
                    type: string
                    example: INTERNAL_ERROR
                  message:
                    type: string
                    example: 伺服器發生錯誤
              timestamp:
                type: string
                format: date-time

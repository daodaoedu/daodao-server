                            example: 1
                          limit:
                            type: integer
                            example: 20
                          total:
                            type: integer
                            example: 100
                          totalPages:
                            type: integer
                            example: 5
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

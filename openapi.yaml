        - in: query
          name: sort
          schema:
            type: string
            enum:
              - createdAt
              - updatedAt
              - likeCount
            default: createdAt
          description: 排序欄位
        - in: query
          name: order
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc

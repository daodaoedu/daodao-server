name: Continuous Integration

# ===== 並發控制設定 =====
# 目的：防止同一分支的多個 CI 檢查同時執行，避免資源浪費
# group: 針對 PR 使用 head_ref，其他情況使用 ref
# cancel-in-progress: 當新的 CI 檢查觸發時，自動取消舊的檢查
# 優點：節省 CI 資源、加快回饋速度、避免過時的檢查結果
# =======================
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# ===== 觸發條件設定 =====
# 1. pull_request：當向 main 或 dev 分支提交 PR 時觸發
#    - 確保代碼合併前通過品質檢查
#    - 支援 main 和 dev 分支的不同環境需求
# 2. workflow_call：被其他 workflow（如 CD）調用時執行
#    - 提供 generated-files-artifact 輸出供 CD 使用
#    - 實現 CI/CD 流程的模組化設計
# 3. workflow_dispatch：手動觸發選項
#    - 調試用途或特殊情況下的獨立 CI 檢查
# =======================
on:
  # 只在 PR 時執行獨立的 CI 檢查
  pull_request:
    branches:
      - main
      - production
      - dev
  # 被其他 workflow 調用時執行
  workflow_call:
    outputs:
      generated-files-artifact:
        description: "Name of the generated files artifact"
        value: ${{ jobs.test.outputs.artifact-name }}
  # 手動觸發 CI 檢查
  workflow_dispatch:
  # Nightly full regression on the default branch; this workflow never deploys.
  schedule:
    - cron: '15 1 * * *'

# ===== 全域環境變數 =====
# NODE_VERSION: 指定 Node.js 版本，確保開發和生產環境一致
# DOCKER_BUILDKIT: 啟用 Docker BuildKit（雖然 CI 階段不構建映像，但保持一致性）
# ========================
env:
  NODE_VERSION: 20
  DOCKER_BUILDKIT: 1

# Quality checks never need a write-capable repository token.
permissions:
  contents: read

jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.select.outputs.backend }}
      oauth: ${{ steps.select.outputs.oauth }}
      schema: ${{ steps.select.outputs.schema }}
      workflows: ${{ steps.select.outputs.workflows }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Select affected CI work
      id: select
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: python3 .github/scripts/ci-selection.py --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
    - name: Validate CI selection
      env:
        PLAN_JSON: ${{ toJSON(steps.select.outputs) }}
      run: python3 .github/scripts/check-ci-result.py plan
    - uses: actions/setup-python@v5
      if: steps.select.outputs.workflows == 'true'
      with:
        python-version: '3.11'
    - name: Install workflow test dependency
      if: steps.select.outputs.workflows == 'true'
      run: python -m pip install PyYAML==6.0.2
    - name: Test quality gate failure propagation
      if: steps.select.outputs.workflows == 'true'
      run: python -m unittest discover -s .github/scripts/__tests__ -p 'test_*.py' -v

  # ===== 主要測試與品質檢查階段 =====
  # 目的：執行完整的程式碼品質檢查流程
  # 包含項目：
  #   - TypeScript 類型檢查
  #   - ESLint 代碼品質檢查
  #   - Jest 單元測試
  #   - Prisma 類型生成
  # 輸出：generated-files artifact 供 CD workflow 使用
  # 運行環境：ubuntu-latest（穩定且快速）
  # =====================================
  backend:
    needs: workflow-tests
    if: needs.workflow-tests.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: daodao_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --label io.daodao.local-tests=${{ github.run_id }}-${{ github.run_attempt }}-oauth
          --health-cmd "pg_isready -U test -d daodao_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --label io.daodao.local-tests=${{ github.run_id }}-${{ github.run_attempt }}-oauth
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: ${{ needs.workflow-tests.outputs.oauth == 'true' && 'axllent/mailpit:v1.29.0' || '' }}
        options: >-
          --label io.daodao.local-tests=${{ github.run_id }}-${{ github.run_attempt }}-oauth
        ports:
          - 127.0.0.1:1025:1025
          - 127.0.0.1:8025:8025
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/daodao_test
    outputs:
      artifact-name: generated-files-${{ github.sha }}
    steps:
      # ===== 代碼檢出 =====
      # 使用淺層克隆（fetch-depth: 1）加快檢出速度
      # 對於 CI 檢查，通常不需要完整的 git 歷史
      # actions/checkout@v4：最新穩定版本
      # ==================
      - name: Checkout code (shallow)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Read shared test database configuration
        id: test-db
        run: python3 .github/scripts/test-database-config.py >> "$GITHUB_OUTPUT"

      - name: Checkout database schema for integration tests
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.test-db.outputs.storage_repository }}
          ref: ${{ steps.test-db.outputs.storage_ref }}
          path: _storage
          token: ${{ secrets.GIT_HUB_ACCESS_TOKEN }}
          persist-credentials: false

      - name: Initialize disposable integration database
        run: bash .github/scripts/init-test-database.sh "${{ job.services.postgres.id }}" "_storage/${{ steps.test-db.outputs.schema_directory }}"

      # ===== Node.js 環境設定 =====
      # 設定指定版本的 Node.js 環境
      # 使用全域環境變數 NODE_VERSION 確保版本一致性
      # actions/setup-node@v4：最新穩定版本
      # 注意：不使用內建 cache，因為要使用 pnpm
      # ===========================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ===== 安裝 pnpm =====
      # 使用官方 pnpm action 安裝 pnpm
      # version: 9 指定主版本號，自動使用最新的 9.x 版本
      # run_install: false 因為我們要利用快取機制自行安裝
      # =====================
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      # ===== 取得 pnpm store 路徑 =====
      # 用於設定快取路徑
      # pnpm store path 會返回 pnpm 的全域 store 路徑
      # ================================
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # ===== pnpm 依賴快取 =====
      # 多層快取策略：
      # 1. 優先快取：pnpm store（最快恢復）
      # 2. 備用快取：OS 級別快取
      # key：基於 pnpm-lock.yaml 雜湊值，確保依賴變更時重新安裝
      # id：用於後續步驟判斷是否命中快取
      # ==========================
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # ===== 依賴安裝 =====
      # pnpm install --frozen-lockfile：
      #   - 類似 npm ci，確保安裝與 lockfile 完全一致的版本
      #   - 不修改 pnpm-lock.yaml
      #   - 適合 CI/CD 環境
      # ===================
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ===== Prisma 客戶端快取 =====
      # 針對 Prisma 生成的文件進行專門快取
      # 快取路徑：
      #   - generated/prisma：專案自定義 Prisma 客戶端位置
      #   - node_modules/.prisma：預設 Prisma 客戶端位置
      # key：基於 schema.prisma 檔案雜湊值
      # 當資料庫結構變更時自動重新生成
      # ============================
      - name: Cache Prisma Client
        uses: actions/cache@v4
        with:
          path: |
            generated/prisma
            node_modules/.prisma
          key: ${{ runner.os }}-prisma-${{ hashFiles('**/schema.prisma') }}
          restore-keys: |
            ${{ runner.os }}-prisma-

      # ===== 類型生成 =====
      # 執行專案的類型生成腳本
      # pnpm run types:generate 包含：
      #   - Prisma 客戶端生成（prisma generate）
      #   - OpenAPI 類型生成
      # 這些生成的文件對於 TypeScript 編譯是必需的
      # ===================
      - name: Generate Prisma Client and OpenAPI types
        run: pnpm run types:generate

      # ===== 品質檢查 =====
      # 依序執行檢查，避免三個 Node.js 程序同時競爭記憶體：
      # 1. typecheck：TypeScript 類型檢查
      # 2. lint：ESLint 代碼品質和風格檢查
      # 3. test：Jest 單元測試執行
      #
      # & 符號：背景執行命令
      # 逐一 wait PID，收集退出碼並等待所有背景任務完成
      # 任何一個檢查失敗都會導致整個步驟失敗
      # ========================
      - name: Test local integration runner
        run: pnpm run test:runner

      - name: Run checks in parallel
        shell: bash
        run: |
          pnpm run typecheck &
          typecheck_pid=$!
          pnpm run lint &
          lint_pid=$!
          pnpm test &
          test_pid=$!
          check_result=0
          wait "$typecheck_pid" || check_result=1
          wait "$lint_pid" || check_result=1
           wait "$test_pid" || check_result=1
           exit "$check_result"

      - name: Run OAuth integration tests
        if: needs.workflow-tests.outputs.oauth == 'true'
        env:
          OAUTH_INTEGRATION_TEST: '1'
          OAUTH_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          OAUTH_TEST_REDIS_URL: redis://127.0.0.1:6379/0
          OAUTH_TEST_SMTP_PORT: '1025'
          OAUTH_TEST_MAILPIT_URL: http://127.0.0.1:8025
          OAUTH_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-oauth
          OAUTH_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          OAUTH_TEST_REDIS_CONTAINER_ID: ${{ job.services.redis.id }}
          OAUTH_TEST_MAILPIT_CONTAINER_ID: ${{ job.services.mailpit.id }}
        run: pnpm run test:oauth:integration

      # ===== 生成文件上傳 =====
      # 目的：將生成的類型文件上傳為 artifact
      # 用途：供 CD workflow 下載使用，避免重複生成
      # 內容：
      #   - generated/ 目錄：包含 Prisma 客戶端類型
      #   - openapi.yaml：API 文檔規格文件
      # retention-days: 1：只保留 1 天（節省儲存空間）
      # name：使用 commit SHA 確保唯一性
      # ==========================
      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: generated-files-${{ github.sha }}
          path: |
            generated/
            openapi.yaml
            openapi.json
          retention-days: 1

      # 成功通知併入 test job 的最後一步：獨立 job 每次至少計費 1 分鐘（10 月約 100 分鐘）。
      # continue-on-error：Discord 失敗不能讓 required check `test` 變紅
      - name: Send CI Success Notification
        if: success()
        continue-on-error: true
        run: |
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          curl -X POST -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"color\": 3066993,
              \"thumbnail\": {
                \"url\": \"https://img.shields.io/badge/CI-Passed-brightgreen.png?style=for-the-badge&logo=github-actions&logoColor=white\"
              },
              \"fields\": [
                {\"name\": \"Commit\", \"value\": \"[\`$SHORT_SHA\`](https://github.com/$REPO/commit/$COMMIT_SHA)\", \"inline\": false}
              ],
              \"timestamp\": \"$CURRENT_TIME\"
            }]
          }" ${{ secrets.DISCORD_WEBHOOK_URL }}

  # Stable required gate: planned skips pass; missing plans and failed workers do not.
  test:
    needs:
    - workflow-tests
    - backend
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact-name: ${{ needs.backend.outputs.artifact-name }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Validate selected CI results
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: python3 .github/scripts/check-ci-result.py test

  # ===== CI 失敗通知階段 =====
  # 目的：向團隊 Discord 頻道發送 CI 檢查失敗警告
  # 執行條件：只在 test job 失敗時執行
  # 通知內容：
  #   - 失敗警告訊息
  #   - 相關倉庫和提交資訊
  #   - 紅色警告標識
  # 用途：及時通知團隊代碼品質問題
  # ==============================
  notify-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    if: failure()
    steps:
      # ===== Discord 失敗通知發送 =====
      # 失敗通知特點：
      #   - 紅色 embed（color: 16711680）表示失敗
      #   - 明確的錯誤描述和修復指引
      #   - 包含相同的上下文資訊便於定位問題
      #   - 使用紅色標識符號表示失敗
      # 
      # 觸發時機：
      #   - TypeScript 類型檢查失敗
      #   - ESLint 檢查不通過
      #   - Jest 測試失敗
      #   - 依賴安裝或類型生成失敗
      # ================================
      - name: Send CI Failure Notification
        run: |
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          curl -X POST -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"color\": 16711680,
              \"thumbnail\": {
                \"url\": \"https://img.shields.io/badge/CI-Failed-red.png?style=for-the-badge&logo=github-actions&logoColor=white\"
              },
              \"fields\": [
                {\"name\": \"Commit\", \"value\": \"[\`$SHORT_SHA\`](https://github.com/$REPO/commit/$COMMIT_SHA)\", \"inline\": false}
              ],
              \"timestamp\": \"$CURRENT_TIME\"
            }]
          }" ${{ secrets.DISCORD_WEBHOOK_URL }}

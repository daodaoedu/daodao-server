name: Schema Drift Check

# Detects drift between daodao-storage SQL schema and daodao-server Prisma schema.
# Fails if tables or columns exist in one but not the other.
# To suppress known drift, add entries to .schema-drift-ignore.json at the project root.

concurrency:
  group: schema-drift-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
      - production
      - dev
  # Nightly catch for storage-side schema changes (storage repo has no CI hook here)
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      storage_ref:
        description: 'Optional paired storage commit (full 40-character SHA; empty uses dev)'
        type: string
        default: ''
      frontend_ref:
        description: 'Optional paired frontend commit; runs full isolated journeys with storage_ref'
        type: string
        default: ''

env:
  NODE_VERSION: 20

jobs:
  check:
    name: Compare SQL ↔ Prisma schemas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout daodao-server
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select affected CI work
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/ci-selection.py --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Validate CI selection
        env:
          PLAN_JSON: ${{ toJSON(steps.select.outputs) }}
        run: python3 .github/scripts/check-ci-result.py plan

      - name: Validate immutable paired revisions
        if: steps.select.outputs.schema == 'true' && (github.event_name == 'workflow_dispatch')
        env:
          STORAGE_REF: ${{ inputs.storage_ref }}
          FRONTEND_REF: ${{ inputs.frontend_ref }}
        run: |
          [[ -z "$STORAGE_REF" || "$STORAGE_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ -z "$FRONTEND_REF" || "$FRONTEND_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ -z "$FRONTEND_REF" || -n "$STORAGE_REF" ]] || exit 1

      # Requires a PAT with read access to daodao-storage.
      # Create a fine-grained PAT at https://github.com/settings/tokens
      # and store it as the STORAGE_REPO_PAT repository secret.
      - name: Checkout daodao-storage
        if: steps.select.outputs.schema == 'true'
        uses: actions/checkout@v4
        with:
          repository: daodaoedu/daodao-storage
          path: _storage
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.storage_ref || 'dev' }}
          token: ${{ secrets.GIT_HUB_ACCESS_TOKEN }}
          fetch-depth: 1

      - name: Record checked revisions
        if: steps.select.outputs.schema == 'true'
        run: |
          printf 'server=%s\n' "$(git rev-parse HEAD)"
          printf 'storage=%s\n' "$(git -C _storage rev-parse HEAD)"

      - name: Set up Node.js
        if: steps.select.outputs.schema == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        if: steps.select.outputs.schema == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        if: steps.select.outputs.schema == 'true'
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        if: steps.select.outputs.schema == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        if: steps.select.outputs.schema == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run schema drift check
        if: steps.select.outputs.schema == 'true'
        env:
          STORAGE_SCHEMA_PATH: ${{ github.workspace }}/_storage/schema
        run: npx ts-node --transpile-only -r tsconfig-paths/register src/scripts/check-schema-drift.ts

      - name: Send drift alert to Discord
        if: failure() && github.event_name == 'schedule'
        run: |
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          curl -X POST -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"⚠️ Schema Drift Detected\",
              \"description\": \"Prisma schema has drifted from daodao-storage SQL schema. Run locally to see details.\",
              \"color\": 16744272,
              \"fields\": [
                {\"name\": \"Branch\", \"value\": \"${{ github.ref_name }}\", \"inline\": true},
                {\"name\": \"Workflow\", \"value\": \"[View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\", \"inline\": true}
              ],
              \"timestamp\": \"$CURRENT_TIME\"
            }]
          }" ${{ secrets.DISCORD_WEBHOOK_URL }}

  journeys:
    if: github.event_name == 'workflow_dispatch' && inputs.storage_ref != '' && inputs.frontend_ref != ''
    needs: check
    permissions:
      contents: read
    uses: daodaoedu/daodao/.github/workflows/journeys-reusable.yml@317c88c3fe3eea4163f018d9954bd39c17662b5d
    with:
      infra_ref: 82da8c3e8f99f0c08453776af6c20f37e8f89e8b
      caller_repository: daodao-server
      caller_sha: ${{ github.sha }}
      mode: local
      full: true
      revisions: ${{ format('{{"daodao-storage":"{0}","daodao-f2e":"{1}"}}', inputs.storage_ref, inputs.frontend_ref) }}
    secrets:
      CROSS_REPO_TOKEN: ${{ secrets.JOURNEY_CROSS_REPO_TOKEN }}

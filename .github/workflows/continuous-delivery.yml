name: Continuous Delivery

# ===== 並發控制設定 =====
# 目的：防止同一分支的多個部署同時執行
# group: 使用 workflow 名稱和 ref 建立唯一群組識別
# cancel-in-progress: 當有新的部署時，自動取消進行中的舊部署
# 這樣可以確保只有最新的代碼被部署到伺服器
# =======================
concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ===== 觸發條件設定 =====
# 1. push 事件：當代碼推送到 main 或 dev 分支時自動觸發
#    - main 分支：部署到生產環境
#    - dev 分支：部署到開發環境
# 2. workflow_dispatch：提供手動觸發選項
#    - force_deploy：允許跳過 CI 檢查直接部署（緊急修復時使用）
# =======================
on:
  push:
    branches:
      - main
      - production
      - dev
  # 手動觸發部署
  workflow_dispatch:
    inputs:
      force_deploy:
        description: '強制部署 (跳過 CI 檢查)'
        required: false
        default: false
        type: boolean

# ===== 全域環境變數 =====
# NODE_VERSION: 指定 Node.js 版本，確保構建一致性
# DOCKER_BUILDKIT: 啟用 Docker BuildKit 以支援進階快取功能
# ========================
env:
  NODE_VERSION: 20
  DOCKER_BUILDKIT: 1

jobs:
  # ===== 持續整合 (CI) 階段 =====
  # 目的：在部署前執行程式碼品質檢查
  # 執行條件：
  #   - 只在 push 事件時執行（確保程式碼品質）
  #   - 手動部署且啟用 force_deploy 時跳過（緊急部署）
  # 內容：呼叫 continuous-integration.yml 執行測試、linting 等
  # secrets: inherit 確保子工作流程可以存取相同的 secrets
  # ==============================
  continuous_integration:
    if: ${{ github.event_name == 'push' && !inputs.force_deploy }}
    uses: ./.github/workflows/continuous-integration.yml
    secrets: inherit

  # ===== Docker 映像構建階段 =====
  # 目的：構建應用程式的 Docker 映像並推送到 Docker Hub
  # 執行條件：
  #   - CI 成功完成
  #   - 或手動觸發且啟用 force_deploy
  #   - 或 CI 被跳過（例如直接手動部署）
  # 輸出：
  #   - image-tag：環境標籤（prod/dev）供後續步驟使用
  #   - image-digest：映像摘要用於驗證
  # ===============================
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [continuous_integration]
    # 當 CI 成功、手動強制部署、或沒有執行 CI 時執行
    if: ${{ always() && (needs.continuous_integration.result == 'success' || inputs.force_deploy || needs.continuous_integration.result == 'skipped') }}
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download generated files
        if: ${{ needs.continuous_integration.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.continuous_integration.outputs.generated-files-artifact }}

      # ===== 安裝 Node.js 和 pnpm (當跳過 CI 時) =====
      # 當直接部署或強制部署時需要手動生成文件
      # 因此需要設置 Node.js 和 pnpm 環境
      # ===============================================
      - name: Set up Node.js (when CI was skipped)
        if: ${{ needs.continuous_integration.result != 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm (when CI was skipped)
        if: ${{ needs.continuous_integration.result != 'success' }}
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Generate files when CI was skipped or forced
        if: ${{ needs.continuous_integration.result != 'success' }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run types:generate

      # ===== 環境變數設定 =====
      # 根據分支決定部署環境：
      # - main 分支 → prod 環境
      # - 其他分支 → dev 環境
      # 設定的變數：
      # - IMAGE_TAG：Docker 映像標籤
      # - NODE_ENV：Node.js 環境
      # - CACHE_TAG：快取標籤
      # - image-tag：輸出給其他 job 使用
      # ========================
      - name: Set Environment Variables
        id: meta
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "IMAGE_TAG=prod" >> $GITHUB_ENV
            echo "NODE_ENV=prod" >> $GITHUB_ENV
            echo "CACHE_TAG=prod" >> $GITHUB_ENV
            echo "image-tag=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/production" ]; then
            echo "IMAGE_TAG=production" >> $GITHUB_ENV
            echo "NODE_ENV=prod" >> $GITHUB_ENV
            echo "CACHE_TAG=production" >> $GITHUB_ENV
            echo "image-tag=production" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
            echo "NODE_ENV=dev" >> $GITHUB_ENV
            echo "CACHE_TAG=dev" >> $GITHUB_ENV
            echo "image-tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # ===== 檢測類型變更 =====
      # 檢查本次 commit 是否涉及類型文件變更
      # 如果有類型變更，禁用快取確保正確重建
      # ==============================
      - name: Check for type changes
        id: type_changes
        run: |
          if git diff --name-only ${{ github.event.before }}..${{ github.sha }} | grep -E "(src/types/.*\.ts$|\.d\.ts$|tsconfig.*\.json$)"; then
            echo "type_changed=true" >> $GITHUB_OUTPUT
            echo "🔄 Type files changed, will build without cache"
          else
            echo "type_changed=false" >> $GITHUB_OUTPUT
            echo "✅ No type changes, will use cache"
          fi

      # ===== Docker 映像構建與推送 =====
      # 智慧快取策略說明：
      # 1. Registry 快取：從當前環境的最新映像讀取（最可能命中相同依賴層）
      # 2. BuildCache：從專用快取映像讀取（保存完整構建快取）
      # 3. GitHub Actions：從本地快取讀取（速度最快）
      # 4. 類型檢測：類型文件變更時禁用快取
      # 
      # 快取輸出策略：
      # 1. 專用快取映像：跨 runner 共享，持久化
      # 2. GitHub Actions 快取：同一 runner 快速存取
      # 3. 內聯快取：由 BUILDKIT_INLINE_CACHE=1 自動處理
      # ================================
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 智慧快取控制：只有類型變更時才禁用快取
          no-cache: ${{ steps.type_changes.outputs.type_changed == 'true' }}
          # 建立兩個標籤：環境標籤和特定 commit 標籤
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/app:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/app:${{ env.IMAGE_TAG }}-${{ github.sha }}
          # 多層快取策略（只有在使用快取時生效）
          cache-from: |
            type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/app:${{ env.CACHE_TAG }}
            type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/app:buildcache-${{ env.CACHE_TAG }}
            type=gha
          cache-to: |
            type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/app:buildcache-${{ env.CACHE_TAG }},mode=max
            type=gha,mode=max
          build-args: |
            NODE_ENV=${{ env.NODE_ENV }}
            BUILDKIT_INLINE_CACHE=1
          platforms: linux/amd64

      # ===== 構建驗證 =====
      # 驗證構建的 Docker 映像是否正常運行
      # 包含基本的健康檢查和功能驗證
      # =====================
      - name: Verify Docker image
        run: |
          echo "🧪 Verifying Docker image..."
          trap 'docker rm -f test-container >/dev/null 2>&1 || true' EXIT
          
          # 測試映像是否可以啟動
          docker run -d --name test-container \
            -p 3001:3000 \
            -e NODE_ENV=${{ env.NODE_ENV }} \
            -e SESSION_SECRET=future-letter-image-smoke-session-secret \
            -e FUTURE_LETTER_ACTIVE_KEY_VERSION=v1 \
            -e 'FUTURE_LETTER_ENCRYPTION_KEYS={"v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}' \
            ${{ secrets.DOCKER_HUB_USERNAME }}/app:${{ env.IMAGE_TAG }}-${{ github.sha }}

          # 最多等待 60 秒，避免固定 sleep 對啟動速度過度敏感
          for attempt in $(seq 1 12); do
            if [ "$(docker inspect -f '{{.State.Running}}' test-container 2>/dev/null || true)" != "true" ]; then
              echo "❌ Container exited before becoming healthy"
              docker logs test-container
              exit 1
            fi

            if curl -f http://localhost:3001/api/v1/health > /dev/null 2>&1; then
              echo "✅ Health check passed"
              break
            fi

            if [ "$attempt" -eq 12 ]; then
              echo "❌ Health check timed out after 60 seconds"
              docker logs test-container
              exit 1
            fi

            sleep 5
          done
          
          # 清理測試容器
          docker stop test-container || true

      # ===== 構建監控 =====
      # 記錄構建時間和快取效率
      # 用於性能監控和優化
      # ====================
      - name: Build monitoring
        if: always()
        run: |
          # 記錄構建資訊
          echo "📊 Build Information:"
          echo "- Image Tag: ${{ env.IMAGE_TAG }}-${{ github.sha }}"
          echo "- Type Changes: ${{ steps.type_changes.outputs.type_changed }}"
          echo "- Cache Used: ${{ steps.type_changes.outputs.type_changed != 'true' }}"
          echo "- Branch: ${{ github.ref_name }}"
          echo "- Commit: ${{ github.sha }}"
          
          # 檢查映像大小
          IMAGE_SIZE=$(docker images ${{ secrets.DOCKER_HUB_USERNAME }}/app:${{ env.IMAGE_TAG }}-${{ github.sha }} --format "table {{.Size}}" | tail -n1)
          echo "- Image Size: $IMAGE_SIZE"
          
          # 如果映像過大，發出警告
          if [[ "$IMAGE_SIZE" == *"GB"* ]]; then
            echo "::warning::Docker image size is larger than 1GB ($IMAGE_SIZE), consider optimizing"
          fi

  # ===== 部署階段 =====
  # 目的：將構建好的 Docker 映像部署到 Linode 伺服器
  # 執行條件：只在 build job 成功後執行
  # environment：根據映像標籤選擇對應的 GitHub 環境
  #   - production：需要審核和特定權限
  #   - development：較寬鬆的部署權限
  # timeout：15 分鐘超時限制，防止部署卡住
  # 部署策略：藍綠部署（Blue-Green Deployment）
  # ====================
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ always() && needs.build.result == 'success' }}
    environment: ${{ needs.build.outputs.image-tag == 'dev' && 'development' || 'production' }}
    timeout-minutes: 20
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LINODE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LINODE_INSTANCE_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to Linode
        env:
          LINODE_INSTANCE_IP: ${{ secrets.LINODE_INSTANCE_IP }}
          BRANCH_NAME: ${{ github.ref_name }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          APP_ENV: ${{ needs.build.outputs.image-tag == 'dev' && 'dev' || 'prod' }}
          APP_SERVICE: ${{ needs.build.outputs.image-tag == 'prod' && 'prod_app' || (needs.build.outputs.image-tag == 'production' && 'production_app' || 'dev_app') }}
          COMMIT_SHA: ${{ github.sha }}
          FUTURE_LETTER_ENCRYPTION_KEYS: ${{ secrets.FUTURE_LETTER_ENCRYPTION_KEYS }}
          # dev-login 測試登入端點的 secret：只在 dev 環境注入；prod 一律清除（路由在 prod 本來就不掛載，這是第二道保險）
          DEV_LOGIN_SECRET: ${{ secrets.DEV_LOGIN_SECRET }}
        run: |
          if [ -z "$FUTURE_LETTER_ENCRYPTION_KEYS" ]; then
            echo "❌ FUTURE_LETTER_ENCRYPTION_KEYS is not configured for this GitHub environment"
            exit 1
          fi

          FUTURE_LETTER_ENCRYPTION_KEYS_B64=$(printf '%s' "$FUTURE_LETTER_ENCRYPTION_KEYS" | base64 | tr -d '\n')
          echo "::add-mask::$FUTURE_LETTER_ENCRYPTION_KEYS_B64"

          DEV_LOGIN_SECRET_B64=""
          if [ "$APP_ENV" = "dev" ]; then
            if [ -z "$DEV_LOGIN_SECRET" ]; then
              echo "⚠️ DEV_LOGIN_SECRET is not configured; POST /api/v1/auth/dev-login will stay unmounted on dev"
            else
              DEV_LOGIN_SECRET_B64=$(printf '%s' "$DEV_LOGIN_SECRET" | base64 | tr -d '\n')
              echo "::add-mask::$DEV_LOGIN_SECRET_B64"
            fi
          fi

          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ConnectTimeout=10 \
            root@$LINODE_INSTANCE_IP bash -s -- "$FUTURE_LETTER_ENCRYPTION_KEYS_B64" "$DEV_LOGIN_SECRET_B64" << 'ENDSSH'
            set -e
            DEPLOY_FUTURE_LETTER_ENCRYPTION_KEYS=$(printf '%s' "$1" | base64 --decode)
            DEPLOY_DEV_LOGIN_SECRET=$(printf '%s' "$2" | base64 --decode)
            export APP_DIR=/root/daodao-server
            export COMPOSE_FILE=docker-compose.yaml
            export APP_ENV=${{ env.APP_ENV }}
            export APP_SERVICE=${{ env.APP_SERVICE }}
            export DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export COMMIT_SHA=${{ env.COMMIT_SHA }}

            echo "=== Starting deployment for $APP_ENV environment ==="

            # ===== 部署前磁碟空間檢查與清理 =====
            # 目的：確保有足夠的磁碟空間進行部署
            # 策略：
            # 1. 檢查當前磁碟使用率
            # 2. 如果使用率 > 80%，自動清理 Docker 資源
            # 3. 清理 build cache（最大空間回收）
            # 4. 清理舊映像和未使用的資源
            # 5. 確保至少有 10GB 可用空間
            # ==========================================
            echo "=== Pre-deployment Disk Space Check ==="
            DISK_USAGE=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
            DISK_AVAIL=$(df -BG / | tail -1 | awk '{print $4}' | sed 's/G//')

            echo "Current disk usage: ${DISK_USAGE}%"
            echo "Available space: ${DISK_AVAIL}GB"

            if [ "$DISK_USAGE" -gt 80 ] || [ "$DISK_AVAIL" -lt 10 ]; then
              echo "⚠️  Disk space is limited (${DISK_USAGE}% used, ${DISK_AVAIL}GB available)"
              echo "=== Starting automatic cleanup ==="

              echo "📊 Docker resource usage before cleanup:"
              docker system df || true

              # 清理 build cache（通常最大）
              echo "Cleaning build cache..."
              docker builder prune -a -f || true

              # 清理未使用的映像（保留運行中容器的映像）
              echo "Cleaning unused images..."
              docker image prune -a -f --filter "until=48h" || true

              # 清理停止的容器
              echo "Cleaning stopped containers..."
              docker container prune -f || true

              # 清理未使用的 volumes（保留命名的 volumes）
              echo "Cleaning unused volumes..."
              docker volume prune -f || true

              # 清理未使用的網路
              echo "Cleaning unused networks..."
              docker network prune -f || true

              echo "📊 Docker resource usage after cleanup:"
              docker system df || true

              # 再次檢查磁碟空間
              DISK_USAGE_AFTER=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
              DISK_AVAIL_AFTER=$(df -BG / | tail -1 | awk '{print $4}' | sed 's/G//')
              echo "Disk usage after cleanup: ${DISK_USAGE_AFTER}%"
              echo "Available space after cleanup: ${DISK_AVAIL_AFTER}GB"

              if [ "$DISK_AVAIL_AFTER" -lt 5 ]; then
                echo "❌ Insufficient disk space after cleanup (${DISK_AVAIL_AFTER}GB available)"
                echo "⚠️  Manual intervention required - please free up more disk space"
                exit 1
              fi

              echo "✅ Cleanup completed successfully"
            else
              echo "✅ Sufficient disk space available"
            fi
            
            # 快速更新代碼（淺層克隆或增量更新）
            if [ -d $APP_DIR/.git ]; then
              cd $APP_DIR
              echo "Updating existing repository..."
              # 只獲取最新的變更
              git fetch --depth 1 origin ${{ env.BRANCH_NAME }}
              git reset --hard FETCH_HEAD
              git clean -fd -e '.env*' -e 'logs/'
            else
              echo "Cloning repository..."
              # 淺層克隆
              git clone --depth 1 --branch ${{ env.BRANCH_NAME }} \
                https://${{ secrets.GIT_HUB_USERNAME }}:${{ secrets.GIT_HUB_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git \
                $APP_DIR
              cd $APP_DIR
            fi

            # 檢查環境文件（docker compose 會驗證所有 service 的 env_file）
            # 範本只有佔位符：只替「非本次部署」的環境補檔讓 compose 驗證通過，
            # 本次部署的 .env.${APP_ENV} 必須是伺服器上既有的真實設定，不從範本產生
            for env in prod production dev; do
              if [ "$env" != "$APP_ENV" ] && [ ! -f .env.${env} ] && [ -f .env.${env}.example ]; then
                cp .env.${env}.example .env.${env}
                echo "Created placeholder .env.${env} from example (compose validation only)"
              fi
            done

            ENV_FILE=.env.${APP_ENV}
            if [ ! -f "$ENV_FILE" ]; then
              echo "❌ Required environment file $ENV_FILE is missing"
              echo "   Create it on the server from .env.${APP_ENV}.example and fill in real values"
              exit 1
            fi

            persist_env_value() {
              key="$1"
              value="$2"
              file="$3"
              temp_file=$(mktemp)
              grep -v "^${key}=" "$file" > "$temp_file" || true
              printf "%s='%s'\n" "$key" "$value" >> "$temp_file"
              chmod 600 "$temp_file"
              mv "$temp_file" "$file"
            }

            remove_env_key() {
              key="$1"
              file="$2"
              temp_file=$(mktemp)
              grep -v "^${key}=" "$file" > "$temp_file" || true
              chmod 600 "$temp_file"
              mv "$temp_file" "$file"
            }

            persist_env_value "FUTURE_LETTER_ACTIVE_KEY_VERSION" "v1" "$ENV_FILE"
            persist_env_value "FUTURE_LETTER_ENCRYPTION_KEYS" "$DEPLOY_FUTURE_LETTER_ENCRYPTION_KEYS" "$ENV_FILE"
            unset DEPLOY_FUTURE_LETTER_ENCRYPTION_KEYS
            echo "Future Letter encryption configuration persisted for $APP_ENV"

            # dev-login：dev 有值就寫入，沒值或非 dev 環境一律移除，避免殘留舊 secret
            if [ "$APP_ENV" = "dev" ] && [ -n "$DEPLOY_DEV_LOGIN_SECRET" ]; then
              persist_env_value "DEV_LOGIN_SECRET" "$DEPLOY_DEV_LOGIN_SECRET" "$ENV_FILE"
              echo "dev-login secret persisted for $APP_ENV"
            else
              remove_env_key "DEV_LOGIN_SECRET" "$ENV_FILE"
              echo "dev-login secret not configured for $APP_ENV (route stays unmounted)"
            fi
            unset DEPLOY_DEV_LOGIN_SECRET

            # 載入環境變數
            set -o allexport && source .env.${APP_ENV} && set +o allexport
            echo "Environment variables loaded for $APP_ENV"

            # ===== 藍綠部署策略實施 =====
            # 策略說明：
            # 1. 保留舊容器運行，確保服務不中斷
            # 2. 啟動新容器並進行健康檢查
            # 3. 確認新容器正常後，才停止舊容器
            # 4. 如果新容器啟動失敗，自動回滾
            # 優點：零停機時間、快速回滾、安全可靠
            # ============================
            echo "=== Blue-Green Deployment Strategy ==="
            OLD_CONTAINER=$(docker ps -q -f name=${APP_SERVICE} | head -1)
            
            if [ -n "$OLD_CONTAINER" ]; then
              echo "Found existing container: $OLD_CONTAINER"
            else
              echo "No existing container found, performing initial deployment"
            fi
            
            # ===== 拉取新映像 =====
            # 使用 docker compose pull 而非 docker pull
            # 優點：
            # - 自動顯示下載進度
            # - 支援多個服務同時拉取
            # - 遵循 compose 文件中的映像設定
            # =======================
            echo "=== Pulling new image with progress display ==="
            echo "Image to pull: ${DOCKER_HUB_USERNAME}/app:${IMAGE_TAG}-${COMMIT_SHA}"
            echo "Using IMAGE_TAG=${IMAGE_TAG}, COMMIT_SHA=${COMMIT_SHA}"
            
            # 直接執行 pull，讓它有足夠時間完成下載
            if DOCKER_HUB_USERNAME=${DOCKER_HUB_USERNAME} IMAGE_TAG=${IMAGE_TAG} COMMIT_SHA=${COMMIT_SHA} \
               docker compose --env-file .env.${APP_ENV} -f $COMPOSE_FILE pull ${APP_SERVICE}; then
              echo "✅ Successfully pulled image"
            else
              echo "❌ Failed to pull image"
              echo "This might be due to network issues or the image doesn't exist"
              exit 1
            fi

            # Fail closed on the candidate image's actual log mount before stopping anything.
            # This only checks permissions; host ownership/ACL changes require operator approval.
            DOCKER_HUB_USERNAME=${DOCKER_HUB_USERNAME} IMAGE_TAG=${IMAGE_TAG} COMMIT_SHA=${COMMIT_SHA} \
              sh scripts/preflight-container-logs.sh

            # ===== 清理舊容器 =====
            # 先停止所有相關的舊容器（可能有 scale 留下的多餘容器）
            # ========================
            echo "=== Cleaning up old containers ==="
            # 停止所有包含服務名的容器（不論是否有編號後綴）
            docker ps -a --filter "name=${APP_SERVICE}" --format "{{.ID}}" | xargs -r docker stop || true
            docker ps -a --filter "name=${APP_SERVICE}" --format "{{.ID}}" | xargs -r docker rm || true
            echo "✅ Old containers cleaned up"

            # ===== 滾動更新部署 =====
            # 使用 Docker Compose 的重新創建策略
            # 1. 啟動新容器
            # 2. 等待新容器健康檢查通過 (最多 90 秒)
            # 3. 自動完成部署
            # ===========================
            echo "=== Rolling Update Deployment ==="

            # 使用 --wait 等待健康檢查通過
            # --wait-timeout 90: 健康檢查最多等待 90 秒
            #   - start_period: 30s (容器啟動緩衝期)
            #   - interval: 10s (檢查間隔)
            #   - retries: 3 (重試次數)
            #   - 總計: 30 + (10 * 3) = 60 秒 + 緩衝 = 90 秒
            echo "Starting new container with health check (timeout: 90s)..."
            if DOCKER_HUB_USERNAME=${DOCKER_HUB_USERNAME} IMAGE_TAG=${IMAGE_TAG} COMMIT_SHA=${COMMIT_SHA} \
               docker compose --env-file .env.${APP_ENV} -f $COMPOSE_FILE up -d --wait --wait-timeout 90 ${APP_SERVICE}; then
              echo "✅ New container started and passed health check"
            else
              echo "❌ Failed to start new container or health check failed"
              echo "Checking container logs..."
              docker compose --env-file .env.${APP_ENV} -f $COMPOSE_FILE logs --tail=100 ${APP_SERVICE} || true

              # 檢查容器狀態
              echo "Container status:"
              docker ps -a --filter "name=${APP_SERVICE}" || true
              exit 1
            fi

            # 額外驗證：確認容器真的在運行並且健康
            echo "=== Additional Health Verification ==="
            NEW_CONTAINER=$(docker ps -q -f name=${APP_SERVICE} | head -1)
            if [ -z "$NEW_CONTAINER" ]; then
              echo "❌ No running container found for ${APP_SERVICE}"
              exit 1
            fi

            # 測試 readiness 端點（daodao#362）：compose --wait 用的 /api/v1/health 只代表行程活著，
            # DB／Redis 連不到時仍回 ok；/api/v1/health/ready 會實際連 DB 與 Redis，連不到回 503，
            # 這裡失敗會讓 deploy job 失敗並觸發 Discord 的部署失敗通知
            for i in {1..10}; do
              if docker exec $NEW_CONTAINER wget --quiet --tries=1 --spider http://localhost:3000/api/v1/health/ready 2>/dev/null; then
                echo "✅ Container $NEW_CONTAINER readiness check passed (attempt $i)"
                break
              fi
              if [ $i -eq 10 ]; then
                echo "❌ Readiness check failed after 10 attempts (DB or Redis unreachable)"
                # 503 時 busybox wget 不印 body；prod 的 logging driver 是 none，docker logs 也看不到，改用 node 印出各依賴狀態
                docker exec $NEW_CONTAINER node -e 'fetch("http://localhost:3000/api/v1/health/ready").then(r => r.text()).then(console.log).catch(console.error)' || true
                docker logs $NEW_CONTAINER --tail=50 2>&1 || true
                exit 1
              fi
              echo "Readiness check attempt $i/10, waiting..."
              sleep 3
            done

            # 清理舊映像
            echo "Cleaning up old images..."
            docker image prune -f --filter "until=24h"

            # ===== 條件式重載 Nginx 配置 =====
            # 只在 nginx.conf 有變更時才重載
            # 使用 git diff 檢測本次部署是否包含 nginx 配置變更
            # ==================================
            echo "=== Checking Nginx Configuration Changes ==="
            if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q "nginx.conf"; then
              echo "📝 nginx.conf changed, reloading configuration..."
              if docker ps -q -f name=nginx | grep -q .; then
                if docker exec nginx nginx -t 2>&1; then
                  echo "✅ Nginx configuration syntax is valid"
                  docker exec nginx nginx -s reload
                  echo "✅ Nginx configuration reloaded successfully"
                else
                  echo "❌ Nginx configuration syntax error!"
                  docker exec nginx nginx -t
                  exit 1
                fi
              else
                echo "⚠️  Nginx container not running, skipping reload"
              fi
            else
              echo "ℹ️  nginx.conf unchanged, skipping reload"
            fi

            echo "=== Deployment completed successfully ==="
          ENDSSH

  # ===== 部署後驗證階段 =====
  # 目的：確保部署成功且服務正常運行
  # 執行時機：部署完成後立即執行
  # 驗證項目：
  #   - Docker 容器狀態
  #   - 系統資源使用情況
  #   - 應用程式日誌
  #   - 最終健康檢查
  # timeout：10 分鐘，比部署階段短
  # ==========================
  verify:
    runs-on: ubuntu-latest
    # 需要直接依賴 build 才讀得到 needs.build.outputs.image-tag；
    # 只寫 deploy 時 image-tag 是空字串，APP_SERVICE 會永遠落到 dev_app（daodao#362）
    needs: [build, deploy]
    timeout-minutes: 10
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LINODE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LINODE_INSTANCE_IP }} >> ~/.ssh/known_hosts
    
      - name: Set Environment Variables
        run: |
          echo "APP_DIR=/root/daodao-server" >> $GITHUB_ENV
          echo "COMPOSE_FILE=docker-compose.yaml" >> $GITHUB_ENV
          echo "APP_ENV=${{ needs.build.outputs.image-tag == 'dev' && 'dev' || (needs.build.outputs.image-tag == 'production' && 'production' || 'prod') }}" >> $GITHUB_ENV
          echo "APP_SERVICE=${{ needs.build.outputs.image-tag == 'prod' && 'prod_app' || (needs.build.outputs.image-tag == 'production' && 'production_app' || 'dev_app') }}" >> $GITHUB_ENV

      - name: Comprehensive Deployment Verification
        env:
          LINODE_INSTANCE_IP: ${{ secrets.LINODE_INSTANCE_IP }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=3 root@$LINODE_INSTANCE_IP "
            set -e
            echo '=== Deployment Verification Started ==='
            
            echo '=== Checking Docker Containers ==='
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

            echo '=== Checking System Resources ==='
            echo 'CPU Load:' && uptime
            echo 'Memory Usage:' && free -h
            echo 'Disk Usage:' && df -h /

            echo '=== Checking Docker Networks ==='
            docker network ls

            echo '=== Checking Nginx Logs ==='
            cd ${{ env.APP_DIR }}
            timeout 10 docker compose -f ${{ env.COMPOSE_FILE }} logs --tail=10 nginx || echo 'Nginx logs check completed'

            echo '=== Checking Application Logs ==='
            timeout 10 docker compose -f ${{ env.COMPOSE_FILE }} logs --tail=10 ${{ env.APP_SERVICE }} || echo 'Application logs check completed'
            
            echo '=== Final Readiness Check (DB + Redis) ==='
            # 失敗要 exit 1，verify job 才會是 failure 並發出 Discord 驗證失敗通知（daodao#362）
            for i in {1..10}; do
              if docker compose exec -T ${{ env.APP_SERVICE }} wget --quiet --tries=1 --spider http://localhost:3000/api/v1/health/ready; then
                echo 'Final readiness check passed'
                break
              fi
              if [ \$i -eq 10 ]; then
                echo '❌ Final readiness check failed after 10 attempts (DB or Redis unreachable)'
                docker compose exec -T ${{ env.APP_SERVICE }} node -e 'fetch(\"http://localhost:3000/api/v1/health/ready\").then(r => r.text()).then(console.log).catch(console.error)' || true
                exit 1
              fi
              echo \"Readiness check attempt \$i/10 failed, retrying...\"
              sleep 5
            done
            
            echo '=== Deployment Verification Complete ==='
          "

  # ===== Discord 通知系統 =====
  # 目的：向團隊報告部署結果
  # 執行條件：always() - 無論成功或失敗都執行
  # 通知類型：
  #   1. 部署失敗：紅色警告，包含錯誤資訊
  #   2. 部署取消：灰色通知
  #   3. 驗證失敗：黃色警告，部署成功但驗證失敗
  #   4. 完全成功：綠色通知，包含完整狀態
  # ============================
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, deploy, verify]
    if: always()
    steps:
      - name: Send Discord Notification
        run: |
          # 獲取部署資訊
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          IMAGE_TAG="${{ needs.build.outputs.image-tag }}"
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # 判斷各階段狀態
          CI_STATUS="${{ needs.continuous_integration.result }}"
          BUILD_STATUS="${{ needs.build.result }}"
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          VERIFY_STATUS="${{ needs.verify.result || 'skipped' }}"
          
          if [ "$CI_STATUS" == "failure" ]; then
            # CI 失敗
            curl -X POST -H "Content-Type: application/json" -d "{
              \"embeds\": [{
                \"color\": 16711680,
                \"thumbnail\": {
                  \"url\": \"https://img.shields.io/badge/CI-Failed-red.png?style=for-the-badge&logo=github&logoColor=white\"
                },
                \"fields\": [
                  {\"name\": \"Commit\", \"value\": \"[\`$SHORT_SHA\`](https://github.com/$REPO/commit/$COMMIT_SHA)\", \"inline\": false}
                ],
                \"timestamp\": \"$CURRENT_TIME\"
              }]
            }" ${{ secrets.DISCORD_WEBHOOK_URL }}
            
          elif [ "$BUILD_STATUS" == "failure" ]; then
            # Build 失敗
            curl -X POST -H "Content-Type: application/json" -d "{
              \"embeds\": [{
                \"color\": 16711680,
                \"thumbnail\": {
                  \"url\": \"https://img.shields.io/badge/Build-Failed-red.png?style=for-the-badge&logo=docker&logoColor=white\"
                },
                \"fields\": [
                  {\"name\": \"Commit\", \"value\": \"[\`$SHORT_SHA\`](https://github.com/$REPO/commit/$COMMIT_SHA)\", \"inline\": false}
                ],
                \"timestamp\": \"$CURRENT_TIME\"
              }]
            }" ${{ secrets.DISCORD_WEBHOOK_URL }}
            
          elif [ "$DEPLOY_STATUS" == "failure" ]; then
            # 部署失敗
            curl -X POST -H "Content-Type: application/json" -d "{
              \"embeds\": [{
                \"color\": 16711680,
                \"thumbnail\": {
                  \"url\": \"https://img.shields.io/badge/Deploy-Failed-red.png?style=for-the-badge&logo=rocket&logoColor=white\"
                },
                \"fields\": [
                  {\"name\": \"Commit\", \"value\": \"[\`$SHORT_SHA\`](https://github.com/$REPO/commit/$COMMIT_SHA)\", \"inline\": false}
                ],
                \"timestamp\": \"$CURRENT_TIME\"
              }]
            }" ${{ secrets.DISCORD_WEBHOOK_URL }}
            
          elif [ "$DEPLOY_STATUS" == "cancelled" ]; then
            # 取消通知
            curl -X POST -H "Content-Type: application/json" -d "{
              \"embeds\": [{
                \"color\": 8421504,
                \"thumbnail\": {
                  \"url\": \"https://img.shields.io/badge/Deploy-Cancelled-lightgrey.png?style=for-the-badge&logo=pause&logoColor=white\"
                },
                \"fields\": [
                  {\"name\": \"Commit\", \"value\": \"[\`$SHORT_SHA\`](https://github.com/$REPO/commit/$COMMIT_SHA)\", \"inline\": false}
                ],
                \"timestamp\": \"$CURRENT_TIME\"
              }]
            }" ${{ secrets.DISCORD_WEBHOOK_URL }}
            
          elif [ "$VERIFY_STATUS" == "failure" ]; then
            # 驗證失敗
            curl -X POST -H "Content-Type: application/json" -d "{
              \"embeds\": [{
                \"color\": 16776960,
                \"thumbnail\": {
                  \"url\": \"https://img.shields.io/badge/Verify-Failed-orange.png?style=for-the-badge&logo=search&logoColor=white\"
                },
                \"fields\": [
                  {\"name\": \"Commit\", \"value\": \"[\`$SHORT_SHA\`](https://github.com/$REPO/commit/$COMMIT_SHA)\", \"inline\": false}
                ],
                \"timestamp\": \"$CURRENT_TIME\"
              }]
            }" ${{ secrets.DISCORD_WEBHOOK_URL }}
            
          elif [ "$BUILD_STATUS" == "success" ] && [ "$DEPLOY_STATUS" == "success" ] && ([ "$VERIFY_STATUS" == "success" ] || [ "$VERIFY_STATUS" == "skipped" ]); then
            # 成功部署  
            curl -X POST -H "Content-Type: application/json" -d "{
              \"embeds\": [{
                \"color\": 3066993,
                \"thumbnail\": {
                  \"url\": \"https://img.shields.io/badge/Deploy-Success-brightgreen.png?style=for-the-badge&logo=check-circle&logoColor=white\"
                },
                \"fields\": [
                  {\"name\": \"Commit\", \"value\": \"[\`$SHORT_SHA\`](https://github.com/$REPO/commit/$COMMIT_SHA)\", \"inline\": false}
                ],
                \"timestamp\": \"$CURRENT_TIME\"
              }]
            }" ${{ secrets.DISCORD_WEBHOOK_URL }}
            
          else
            # 未知狀態或部分失敗
            curl -X POST -H "Content-Type: application/json" -d "{
              \"embeds\": [{
                \"color\": 16776960,
                \"thumbnail\": {
                  \"url\": \"https://img.shields.io/badge/Status-Unknown-yellow.png?style=for-the-badge&logo=question&logoColor=white\"
                },
                \"fields\": [
                  {\"name\": \"Commit\", \"value\": \"[\`$SHORT_SHA\`](https://github.com/$REPO/commit/$COMMIT_SHA)\", \"inline\": false}
                ],
                \"timestamp\": \"$CURRENT_TIME\"
              }]
            }" ${{ secrets.DISCORD_WEBHOOK_URL }}
          fi

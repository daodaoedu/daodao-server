name: Deploy to Linode

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  # Step 1: 測試階段
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  # Step 2: 部署階段
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LINODE_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LINODE_INSTANCE_IP }} >> ~/.ssh/known_hosts

      - name: Set Environment Variables
        run: |
          echo "APP_DIR=/root/daodao-server" >> $GITHUB_ENV
          echo "COMPOSE_FILE=docker-compose.yaml" >> $GITHUB_ENV
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "APP_ENV=prod" >> $GITHUB_ENV
            echo "APP_SERVICE=prod_app" >> $GITHUB_ENV
          else
            echo "APP_ENV=dev" >> $GITHUB_ENV
            echo "APP_SERVICE=dev_app" >> $GITHUB_ENV
          fi

      - name: Deploy to Linode
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
        env:
          LINODE_INSTANCE_IP: ${{ secrets.LINODE_INSTANCE_IP }}
          GIT_HUB_USERNAME: ${{ secrets.GIT_HUB_USERNAME }}
          GIT_HUB_ACCESS_TOKEN: ${{ secrets.GIT_HUB_ACCESS_TOKEN }}
        run: |
          ssh -o StrictHostKeyChecking=no root@$LINODE_INSTANCE_IP "
            set -euo pipefail

            export APP_SERVICE=\"${{ env.APP_SERVICE }}\"
            export APP_DIR=\"${{ env.APP_DIR }}\"
            export COMPOSE_FILE=\"${{ env.COMPOSE_FILE }}\"
            export APP_ENV=\"${{ env.APP_ENV }}\"

            # 確保目標目錄存在
            mkdir -p \"\$APP_DIR\"
            cd \"\$APP_DIR\"

            # 檢查專案是否已存在
            if [ -d .git ]; then
              echo 'Existing repository found, performing update...'
              git fetch --all
              git checkout ${{ github.ref_name }}
              git reset --hard origin/${{ github.ref_name }}
              git clean -fd
            else
              echo 'No repository found, performing initial clone...'
              git clone https://${{ env.GIT_HUB_USERNAME }}:${{ env.GIT_HUB_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git \"\$APP_DIR\"
              cd \"\$APP_DIR\"
            fi

            # 檢查 .env 是否存在；若無則建立
            if [ ! -f \".env.\${APP_ENV}\" ]; then
              cp \".env.\${APP_ENV}_temp\" \".env.\${APP_ENV}\"
            fi
            
            # 檢查並修正 .env 檔案中的錯誤
            # 找出並修正 line 14 的 ulcg 錯誤
            sed -i '14s/ulcg//' \".env.\${APP_ENV}\"

            # 正確載入環境變數
            set -o allexport 
            source \".env.\${APP_ENV}\" 
            set +o allexport

            if [ \"\$DEPLOYMENT_TYPE\" = 'initial' ]; then
              echo \"Performing initial deployment...\"
              docker-compose --env-file \".env.\${APP_ENV}\" -f \"\$COMPOSE_FILE\" up -d
            else
              echo \"Performing update deployment...\"
              docker-compose stop \"\$APP_SERVICE\"
              docker-compose rm -f \"\$APP_SERVICE\"
              docker ps -a
              docker container prune -f
              docker image prune -f
              docker network prune -f
              
              echo \"Updating specific services for \${APP_ENV} environment...\"
              docker-compose --env-file \".env.\${APP_ENV}\" -f \"\$COMPOSE_FILE\" build --no-cache \"\$APP_SERVICE\"
              docker-compose --env-file \".env.\${APP_ENV}\" -f \"\$COMPOSE_FILE\" up -d --no-deps \"\$APP_SERVICE\"
            fi
          "

  # Step 3: 驗證部署狀態
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Set Environment Variables
        run: |
          echo "APP_DIR=/root/daodao-server" >> $GITHUB_ENV
          echo "COMPOSE_FILE=docker-compose.yaml" >> $GITHUB_ENV
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "APP_ENV=prod" >> $GITHUB_ENV
            echo "APP_SERVICE=prod_app" >> $GITHUB_ENV
          else
            echo "APP_ENV=dev" >> $GITHUB_ENV
            echo "APP_SERVICE=dev_app" >> $GITHUB_ENV
          fi

      - name: Verify Deployment
        env:
          LINODE_INSTANCE_IP: ${{ secrets.LINODE_INSTANCE_IP }}
        run: |
          ssh -o StrictHostKeyChecking=no root@$LINODE_INSTANCE_IP "
            echo '=== Checking Docker Containers ==='
            docker ps

            echo '=== Checking System Resources ==='
            echo 'CPU Load:' && uptime
            echo 'Memory Usage:' && free -h
            echo 'Disk Usage:' && df -h /

            echo '=== Checking Docker Networks ==='
            docker network ls

            echo '=== Checking Nginx Logs ==='
            docker-compose -f ${{ env.COMPOSE_FILE }} logs --tail=20 nginx | tail -n 10

            echo '=== Checking Application Logs ==='
            docker-compose -f ${{ env.COMPOSE_FILE }} logs --tail=20 ${{ env.APP_SERVICE }} | tail -n 10

            echo '=== Running API Health Check ==='
            if ! curl -fsSL http://localhost:3000/health; then
              echo 'ERROR: API is not responding!'
              exit 1
            fi
          "

  # Step 4: Discord 通知
  notify:
    needs: verify
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Discord on Failure
        if: ${{ needs.verify.result == 'failure' }}
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d '{"content": "🚨 SERVER部署失敗！請檢查 GitHub Actions 記錄。", "embeds": [{"color": 16711680}]}' \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Notify Discord on Success
        if: ${{ needs.verify.result == 'success' }}
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d '{"content": "✅ SERVER部署成功！🎉", "embeds": [{"color": 3066993}]}' \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
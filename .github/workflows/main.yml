name: Optimized Deploy to Linode

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  NODE_VERSION: 20
  DOCKER_BUILDKIT: 1

jobs:
  # 並行執行測試和構建
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Prisma Client
        uses: actions/cache@v3
        with:
          path: |
            generated/prisma
            node_modules/.prisma
          key: ${{ runner.os }}-prisma-${{ hashFiles('**/schema.prisma') }}

      - name: Generate Prisma Client and OpenAPI types
        run: npm run types:generate

      - name: Run checks in parallel
        run: |
          npm run typecheck &
          npm run lint &
          npm test &
          wait

      # 上傳 artifacts 供其他 jobs 使用
      - name: Upload generated files
        uses: actions/upload-artifact@v3
        with:
          name: generated-files
          path: |
            generated/
            openapi.yaml
          retention-days: 1

  # 並行構建 Docker image
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - branch: main
            tag: prod
            env: prod
          - branch: dev
            tag: dev
            env: dev
    steps:
      - name: Checkout code (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download generated files
        uses: actions/download-artifact@v3
        with:
          name: generated-files

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        if: (github.ref == 'refs/heads/main' && matrix.branch == 'main') || (github.ref == 'refs/heads/dev' && matrix.branch == 'dev')
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/app:${{ matrix.tag }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/app:${{ matrix.tag }}-${{ github.sha }}
          build-args: |
            NODE_ENV=${{ matrix.env }}
          cache-from: |
            type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/app:buildcache-${{ matrix.tag }}
            type=gha
          cache-to: |
            type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/app:buildcache-${{ matrix.tag }},mode=max
            type=gha,mode=max
          platforms: linux/amd64

  # 優化後的部署
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LINODE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LINODE_INSTANCE_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to Linode (Optimized)
        env:
          LINODE_INSTANCE_IP: ${{ secrets.LINODE_INSTANCE_IP }}
          BRANCH_NAME: ${{ github.ref_name }}
          IMAGE_TAG: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          APP_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          APP_SERVICE: ${{ github.ref == 'refs/heads/main' && 'prod_app' || 'dev_app' }}
        run: |
          ssh -o StrictHostKeyChecking=no root@$LINODE_INSTANCE_IP << 'ENDSSH'
            set -e
            export APP_DIR=/root/daodao-server
            export COMPOSE_FILE=docker-compose.yaml
            export APP_ENV=${{ env.APP_ENV }}
            export APP_SERVICE=${{ env.APP_SERVICE }}
            export DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export COMMIT_SHA=${{ github.sha }}

            # 快速更新代碼（淺層克隆或增量更新）
            if [ -d $APP_DIR/.git ]; then
              cd $APP_DIR
              # 只獲取最新的變更
              git fetch --depth 1 origin ${{ env.BRANCH_NAME }}
              git reset --hard FETCH_HEAD
              git clean -fd
            else
              # 淺層克隆
              git clone --depth 1 --branch ${{ env.BRANCH_NAME }} \
                https://${{ secrets.GIT_HUB_USERNAME }}:${{ secrets.GIT_HUB_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git \
                $APP_DIR
              cd $APP_DIR
            fi

            # 檢查環境文件
            if [ ! -f .env.${APP_ENV} ] && [ -f .env.${APP_ENV}_temp ]; then
              cp .env.${APP_ENV}_temp .env.${APP_ENV}
            fi

            # 載入環境變數
            set -o allexport && source .env.${APP_ENV} && set +o allexport

            # 使用 blue-green 部署策略
            OLD_CONTAINER=$(docker ps -q -f name=${APP_SERVICE})
            
            # 拉取新映像
            docker pull ${DOCKER_HUB_USERNAME}/app:${IMAGE_TAG}-${COMMIT_SHA} || \
            docker pull ${DOCKER_HUB_USERNAME}/app:${IMAGE_TAG}

            # 啟動新容器
            docker-compose --env-file .env.${APP_ENV} -f $COMPOSE_FILE up -d --no-deps --scale ${APP_SERVICE}=2 ${APP_SERVICE}

            # 健康檢查
            echo "Waiting for new container to be healthy..."
            for i in {1..30}; do
              NEW_CONTAINER=$(docker ps -q -f name=${APP_SERVICE} | grep -v $OLD_CONTAINER | head -1)
              if [ -n "$NEW_CONTAINER" ] && docker exec $NEW_CONTAINER wget --quiet --tries=1 --spider http://localhost:3000/api/v1/health; then
                echo "New container is healthy"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            # 停止舊容器
            if [ -n "$OLD_CONTAINER" ]; then
              docker stop $OLD_CONTAINER
              docker rm $OLD_CONTAINER
            fi

            # 清理
            docker image prune -f --filter "until=24h"
          ENDSSH

  # 完整的部署驗證
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LINODE_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LINODE_INSTANCE_IP }} >> ~/.ssh/known_hosts
    
      - name: Set Environment Variables
        run: |
          echo "APP_DIR=/root/daodao-server" >> $GITHUB_ENV
          echo "COMPOSE_FILE=docker-compose.yaml" >> $GITHUB_ENV
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "APP_ENV=prod" >> $GITHUB_ENV
            echo "APP_SERVICE=prod_app" >> $GITHUB_ENV
          else
            echo "APP_ENV=dev" >> $GITHUB_ENV
            echo "APP_SERVICE=dev_app" >> $GITHUB_ENV
          fi

      - name: Verify Deployment
        env:
          LINODE_INSTANCE_IP: ${{ secrets.LINODE_INSTANCE_IP }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=3 root@$LINODE_INSTANCE_IP "
            set -e
            echo '=== Checking Docker Containers ==='
            docker ps

            echo '=== Checking System Resources ==='
            echo 'CPU Load:' && uptime
            echo 'Memory Usage:' && free -h
            echo 'Disk Usage:' && df -h /

            echo '=== Checking Docker Networks ==='
            docker network ls

            echo '=== Checking Nginx Logs ==='
            cd ${{ env.APP_DIR }}
            timeout 10 docker-compose -f ${{ env.COMPOSE_FILE }} logs --tail=10 nginx || echo 'Nginx logs check completed'

            echo '=== Checking Application Logs ==='
            timeout 10 docker-compose -f ${{ env.COMPOSE_FILE }} logs --tail=10 ${{ env.APP_SERVICE }} || echo 'Application logs check completed'
            
            echo '=== Health Check ==='
            for i in {1..10}; do
              if docker-compose exec -T ${{ env.APP_SERVICE }} wget --quiet --tries=1 --spider http://localhost:3000/api/v1/health; then
                echo 'Health check passed'
                break
              fi
              echo \"Health check attempt \$i/10 failed, retrying...\"
              sleep 5
            done
            
            echo '=== Deployment Verification Complete ==='
          "

  # 完整的通知系統
  notify:
    needs: [test, build-and-push, deploy, verify]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Discord
        run: |
          # 獲取作業者資訊
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          RUN_URL="https://github.com/$REPO/actions/runs/${{ github.run_id }}"
          
          # 判斷整體狀態
          TEST_STATUS="${{ needs.test.result }}"
          BUILD_STATUS="${{ needs.build-and-push.result }}"
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          VERIFY_STATUS="${{ needs.verify.result }}"
          
          # 計算執行時間（估算）
          START_TIME="${{ github.event.head_commit.timestamp }}"
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          if [ "$TEST_STATUS" == "cancelled" ] || [ "$BUILD_STATUS" == "cancelled" ] || [ "$DEPLOY_STATUS" == "cancelled" ] || [ "$VERIFY_STATUS" == "cancelled" ]; then
            # 取消通知
            curl -X POST -H "Content-Type: application/json" -d "{
              \"content\": \"⏹️ **部署已取消**\",
              \"embeds\": [{
                \"title\": \"CI/CD Pipeline Cancelled\",
                \"description\": \"工作流程被用戶取消\",
                \"color\": 8421504,
                \"fields\": [
                  {\"name\": \"📋 Repository\", \"value\": \"$REPO\", \"inline\": true},
                  {\"name\": \"🌿 Branch\", \"value\": \"$BRANCH\", \"inline\": true},
                  {\"name\": \"👤 Author\", \"value\": \"$AUTHOR\", \"inline\": true},
                  {\"name\": \"💬 Commit\", \"value\": \"[\`$SHORT_SHA\`](https://github.com/$REPO/commit/$COMMIT_SHA)\n$COMMIT_MSG\", \"inline\": false},
                  {\"name\": \"🔗 Actions\", \"value\": \"[查看詳情]($RUN_URL)\", \"inline\": false}
                ],
                \"timestamp\": \"$CURRENT_TIME\"
              }]
            }" ${{ secrets.DISCORD_WEBHOOK_URL }}
            
          elif [ "$TEST_STATUS" == "failure" ]; then
            # 測試失敗
            curl -X POST -H "Content-Type: application/json" -d "{
              \"content\": \"🚨 **測試失敗！**\",
              \"embeds\": [{
                \"title\": \"❌ Test Phase Failed\",
                \"description\": \"測試階段出現錯誤，請檢查程式碼\",
                \"color\": 16711680,
                \"fields\": [
                  {\"name\": \"📋 Repository\", \"value\": \"$REPO\", \"inline\": true},
                  {\"name\": \"🌿 Branch\", \"value\": \"$BRANCH\", \"inline\": true},
                  {\"name\": \"👤 Author\", \"value\": \"$AUTHOR\", \"inline\": true},
                  {\"name\": \"💬 Commit\", \"value\": \"[\`$SHORT_SHA\`](https://github.com/$REPO/commit/$COMMIT_SHA)\n$COMMIT_MSG\", \"inline\": false},
                  {\"name\": \"🔗 Actions\", \"value\": \"[查看測試日誌]($RUN_URL)\", \"inline\": false}
                ],
                \"timestamp\": \"$CURRENT_TIME\"
              }]
            }" ${{ secrets.DISCORD_WEBHOOK_URL }}
            
          elif [ "$BUILD_STATUS" == "failure" ]; then
            # 構建失敗
            curl -X POST -H "Content-Type: application/json" -d "{
              \"content\": \"🚨 **Docker 構建失敗！**\",
              \"embeds\": [{
                \"title\": \"🔨 Build Phase Failed\",
                \"description\": \"Docker 映像構建過程出現錯誤\",
                \"color\": 16711680,
                \"fields\": [
                  {\"name\": \"📋 Repository\", \"value\": \"$REPO\", \"inline\": true},
                  {\"name\": \"🌿 Branch\", \"value\": \"$BRANCH\", \"inline\": true},
                  {\"name\": \"👤 Author\", \"value\": \"$AUTHOR\", \"inline\": true},
                  {\"name\": \"💬 Commit\", \"value\": \"[\`$SHORT_SHA\`](https://github.com/$REPO/commit/$COMMIT_SHA)\n$COMMIT_MSG\", \"inline\": false},
                  {\"name\": \"🔗 Actions\", \"value\": \"[查看構建日誌]($RUN_URL)\", \"inline\": false}
                ],
                \"timestamp\": \"$CURRENT_TIME\"
              }]
            }" ${{ secrets.DISCORD_WEBHOOK_URL }}
            
          elif [ "$DEPLOY_STATUS" == "failure" ]; then
            # 部署失敗
            curl -X POST -H "Content-Type: application/json" -d "{
              \"content\": \"🚨 **部署失敗！**\",
              \"embeds\": [{
                \"title\": \"🚀 Deploy Phase Failed\",
                \"description\": \"服務器部署過程出現錯誤，請檢查服務器狀態\",
                \"color\": 16711680,
                \"fields\": [
                  {\"name\": \"📋 Repository\", \"value\": \"$REPO\", \"inline\": true},
                  {\"name\": \"🌿 Branch\", \"value\": \"$BRANCH\", \"inline\": true},
                  {\"name\": \"👤 Author\", \"value\": \"$AUTHOR\", \"inline\": true},
                  {\"name\": \"💬 Commit\", \"value\": \"[\`$SHORT_SHA\`](https://github.com/$REPO/commit/$COMMIT_SHA)\n$COMMIT_MSG\", \"inline\": false},
                  {\"name\": \"🔗 Actions\", \"value\": \"[查看部署日誌]($RUN_URL)\", \"inline\": false}
                ],
                \"timestamp\": \"$CURRENT_TIME\"
              }]
            }" ${{ secrets.DISCORD_WEBHOOK_URL }}
            
          elif [ "$VERIFY_STATUS" == "failure" ]; then
            # 驗證失敗
            curl -X POST -H "Content-Type: application/json" -d "{
              \"content\": \"🚨 **健康檢查失敗！**\",
              \"embeds\": [{
                \"title\": \"🏥 Health Check Failed\",
                \"description\": \"服務部署完成但健康檢查失敗，請檢查應用程式狀態\",
                \"color\": 16776960,
                \"fields\": [
                  {\"name\": \"📋 Repository\", \"value\": \"$REPO\", \"inline\": true},
                  {\"name\": \"🌿 Branch\", \"value\": \"$BRANCH\", \"inline\": true},
                  {\"name\": \"👤 Author\", \"value\": \"$AUTHOR\", \"inline\": true},
                  {\"name\": \"💬 Commit\", \"value\": \"[\`$SHORT_SHA\`](https://github.com/$REPO/commit/$COMMIT_SHA)\n$COMMIT_MSG\", \"inline\": false},
                  {\"name\": \"🔗 Actions\", \"value\": \"[查看驗證日誌]($RUN_URL)\", \"inline\": false}
                ],
                \"timestamp\": \"$CURRENT_TIME\"
              }]
            }" ${{ secrets.DISCORD_WEBHOOK_URL }}
            
          else
            # 成功部署
            ENV_INFO=""
            if [ "$BRANCH" == "main" ]; then
              ENV_INFO="🔴 **PRODUCTION** 環境"
            else
              ENV_INFO="🟡 **DEVELOPMENT** 環境"
            fi
            
            curl -X POST -H "Content-Type: application/json" -d "{
              \"content\": \"✅ **部署成功！** 🎉\",
              \"embeds\": [{
                \"title\": \"🚀 Deployment Successful\",
                \"description\": \"所有階段順利完成，服務已更新至 $ENV_INFO\",
                \"color\": 3066993,
                \"fields\": [
                  {\"name\": \"📋 Repository\", \"value\": \"$REPO\", \"inline\": true},
                  {\"name\": \"🌿 Branch\", \"value\": \"$BRANCH\", \"inline\": true},
                  {\"name\": \"👤 Author\", \"value\": \"$AUTHOR\", \"inline\": true},
                  {\"name\": \"💬 Commit\", \"value\": \"[\`$SHORT_SHA\`](https://github.com/$REPO/commit/$COMMIT_SHA)\n$COMMIT_MSG\", \"inline\": false},
                  {\"name\": \"📊 Pipeline Status\", \"value\": \"✅ Test: $TEST_STATUS\n✅ Build: $BUILD_STATUS\n✅ Deploy: $DEPLOY_STATUS\n✅ Verify: $VERIFY_STATUS\", \"inline\": true},
                  {\"name\": \"🔗 Actions\", \"value\": \"[查看完整日誌]($RUN_URL)\", \"inline\": true}
                ],
                \"timestamp\": \"$CURRENT_TIME\"
              }]
            }" ${{ secrets.DISCORD_WEBHOOK_URL }}
          fi
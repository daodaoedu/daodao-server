name: Deploy to Linode

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  # Step 1: 測試階段
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client and OpenAPI types
        run: npm run types:generate

      - name: Validate Prisma client generation
        run: |
          # 確保生成的檔案存在且正確
          ls -la generated/prisma/
          node -e "console.log('Prisma client loaded successfully:', !!require('./generated/prisma'))"

      - name: Run TypeScript check and Lint in parallel
        run: |
          npm run typecheck &
          npm run lint &
          wait

      - name: Run tests
        run: npm test  

  # Step 2: 建構並推送Image
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      
      - name: Set Environment Variables
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "IMAGE_TAG=prod" >> $GITHUB_ENV
            echo "NODE_ENV=prod" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
            echo "NODE_ENV=dev" >> $GITHUB_ENV
          fi
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/app:${{ env.IMAGE_TAG }}
          build-args: |
            NODE_ENV=${{ env.NODE_ENV }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Step 3: 部署階段
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
          
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LINODE_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LINODE_INSTANCE_IP }} >> ~/.ssh/known_hosts

      - name: Set Environment Variables
        run: |
          echo "APP_DIR=/root/daodao-server" >> $GITHUB_ENV
          echo "COMPOSE_FILE=docker-compose.yaml" >> $GITHUB_ENV
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "APP_ENV=prod" >> $GITHUB_ENV
            echo "APP_SERVICE=prod_app" >> $GITHUB_ENV
          else
            echo "APP_ENV=dev" >> $GITHUB_ENV
            echo "APP_SERVICE=dev_app" >> $GITHUB_ENV
          fi

      - name: Deploy to Linode
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
        env:
          LINODE_INSTANCE_IP: ${{ secrets.LINODE_INSTANCE_IP }}
          GIT_HUB_USERNAME: ${{ secrets.GIT_HUB_USERNAME }}
          GIT_HUB_ACCESS_TOKEN: ${{ secrets.GIT_HUB_ACCESS_TOKEN }}
        run: |
            ssh -o StrictHostKeyChecking=no root@$LINODE_INSTANCE_IP "
              export APP_SERVICE=${{ env.APP_SERVICE }}
              export APP_DIR=${{ env.APP_DIR }}
              export COMPOSE_FILE=${{ env.COMPOSE_FILE }}
              export APP_ENV=${{ env.APP_ENV }}

              # 確保目標目錄存在
              mkdir -p \$APP_DIR
  
              # 檢查是否已經存在 Git 倉庫
              if [ -d \$APP_DIR/.git ]; then
                # 如果存在，更新現有倉庫
                cd \$APP_DIR
                git fetch --all
                git checkout ${{ github.ref_name }}
                git reset --hard origin/${{ github.ref_name }}
                git clean -fd
                DEPLOYMENT_TYPE='update'
                echo \"DEPLOYMENT_TYPE='update'\"
              else
                # 如果不存在，克隆倉庫
                git clone https://${{ env.GIT_HUB_USERNAME }}:${{ env.GIT_HUB_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git
                cd \$APP_DIR
                DEPLOYMENT_TYPE='initial'
                echo \"DEPLOYMENT_TYPE='initial'\"
              fi
  
              # 檢查並創建 .env 文件（如果不存在）
              if [ ! -f .env.\${APP_ENV} ]; then
                if [ -f .env.\${APP_ENV}_temp ]; then
                  cp .env.\${APP_ENV}_temp .env.\${APP_ENV}
                  echo \"Created .env.\${APP_ENV} from template\"
                else
                  echo \"Error: .env.\${APP_ENV}_temp template not found\"
                  exit 1
                fi
              fi
              
              # 驗證關鍵環境變數
              if [ -z \"\$DOCKER_HUB_USERNAME\" ]; then
                echo \"Error: DOCKER_HUB_USERNAME not set in environment\"
                exit 1
              fi
  
              set -o allexport && source .env.\${APP_ENV} && set +o allexport
              echo 'Environment variables loaded:'
              
              # 創建部署前資料庫備份和健康檢查
              echo 'Creating database backup...'
              if docker-compose exec -T postgres-\${APP_ENV} pg_isready -U daodao -d daodao; then
                docker-compose exec -T postgres-\${APP_ENV} pg_dump -U daodao daodao > backup_$(date +%Y%m%d_%H%M%S).sql
                echo 'Backup completed'
              else
                echo 'Warning: Database not ready, skipping backup'
              fi
  
              if [ \"\$DEPLOYMENT_TYPE\" = 'initial' ]; then
                echo \"Performing initial deployment...\"
                docker-compose --env-file .env.\${APP_ENV} -f \$COMPOSE_FILE up -d
              else
                echo \"Performing update deployment...\"
                docker-compose stop \$APP_SERVICE
                docker-compose rm -f \$APP_SERVICE
                docker ps -a
                docker container prune -f
                docker image prune -f
                docker network prune -f
                
                echo \"Pulling latest image for \${APP_ENV} environment...\"
                if docker-compose --env-file .env.\${APP_ENV} -f \$COMPOSE_FILE pull \$APP_SERVICE; then
                  echo \"Starting updated service...\"
                  docker-compose --env-file .env.\${APP_ENV} -f \$COMPOSE_FILE up -d --no-deps \$APP_SERVICE
                  
                  # 等待服務啟動並檢查健康狀態
                  echo \"Waiting for service to be healthy...\"
                  for i in {1..30}; do
                    if docker-compose exec -T \$APP_SERVICE wget --quiet --tries=1 --spider http://localhost:3000/api/v1/health; then
                      echo \"Service is healthy\"
                      break
                    fi
                    echo \"Waiting for service... (\$i/30)\"
                    sleep 10
                  done
                else
                  echo \"Failed to pull image, rolling back...\"
                  docker-compose --env-file .env.\${APP_ENV} -f \$COMPOSE_FILE up -d --no-deps \$APP_SERVICE
                  exit 1
                fi
              fi
              
              # 確保 Schema 同步
              echo \"Ensuring schema synchronization...\"
              docker-compose exec -T \$APP_SERVICE npx prisma db pull
              docker-compose exec -T \$APP_SERVICE npx prisma generate
              
              # 重啟應用以載入最新的 Prisma Client
              docker-compose restart \$APP_SERVICE
            "
  
  # Step 4: 驗證部署狀態
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LINODE_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LINODE_INSTANCE_IP }} >> ~/.ssh/known_hosts
    
      - name: Set Environment Variables
        run: |
          echo "APP_DIR=/root/daodao-server" >> $GITHUB_ENV
          echo "COMPOSE_FILE=docker-compose.yaml" >> $GITHUB_ENV
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "APP_ENV=prod" >> $GITHUB_ENV
            echo "APP_SERVICE=prod_app" >> $GITHUB_ENV
          else
            echo "APP_ENV=dev" >> $GITHUB_ENV
            echo "APP_SERVICE=dev_app" >> $GITHUB_ENV
          fi

      - name: Verify Deployment
        env:
          LINODE_INSTANCE_IP: ${{ secrets.LINODE_INSTANCE_IP }}
        run: |
          ssh root@$LINODE_INSTANCE_IP "
            echo '=== Checking Docker Containers ==='
            docker ps

            echo '=== Checking System Resources ==='
            echo 'CPU Load:' && uptime
            echo 'Memory Usage:' && free -h
            echo 'Disk Usage:' && df -h /

            echo '=== Checking Docker Networks ==='
            docker network ls

            echo '=== Checking Nginx Logs ==='
            cd ${{ env.APP_DIR }} && docker-compose -f ${{ env.COMPOSE_FILE }} logs --tail=20 nginx | tail -n 10

            echo '=== Checking Application Logs ==='
            cd ${{ env.APP_DIR }} && docker-compose -f ${{ env.COMPOSE_FILE }} logs --tail=20 ${{ env.APP_SERVICE }} | tail -n 10
          " 
  # Step 5: Discord 通知
  notify:
    needs: [test, build-and-push, verify]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Discord
        run: |
          if [ "${{ needs.test.result }}" == "failure" ]; then
            curl -X POST -H "Content-Type: application/json" \
              -d '{"content": "🚨 測試階段失敗！請檢查 GitHub Actions 記錄。", "embeds": [{"title": "Test Failure", "description": "Tests failed during execution", "color": 16711680}]}' \
              ${{ secrets.DISCORD_WEBHOOK_URL }}
          elif [ "${{ needs.build-and-push.result }}" == "failure" ]; then
            curl -X POST -H "Content-Type: application/json" \
              -d '{"content": "🚨 Image建構失敗！請檢查 GitHub Actions 記錄。", "embeds": [{"title": "Build Failed", "description": "Error in the image build process", "color": 16711680}]}' \
              ${{ secrets.DISCORD_WEBHOOK_URL }}
          elif [ "${{ needs.verify.result }}" == "failure" ]; then
            curl -X POST -H "Content-Type: application/json" \
              -d '{"content": "🚨 部署失敗！請檢查 GitHub Actions 記錄。", "embeds": [{"title": "Deployment Failed", "description": "Error in the deployment process", "color": 16711680}]}' \
              ${{ secrets.DISCORD_WEBHOOK_URL }}
          else
            curl -X POST -H "Content-Type: application/json" \
              -d '{"content": "✅ SERVER部署成功！🎉", "embeds": [{"title": "Deployment Successful", "description": "All steps completed successfully", "color": 3066993}]}' \
              ${{ secrets.DISCORD_WEBHOOK_URL }}
          fi
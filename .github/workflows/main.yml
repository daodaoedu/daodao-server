name: Deploy to Linode

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  # Step 1: 測試階段
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run tests
        run: npm test  

  # Step 2: 部署階段
  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
          
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LINODE_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LINODE_INSTANCE_IP }} >> ~/.ssh/known_hosts

      - name: Set Environment Variables
        run: |
          echo "APP_DIR=/root/daodao-server" >> $GITHUB_ENV
          echo "COMPOSE_FILE=docker-compose.yaml" >> $GITHUB_ENV
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "APP_ENV=prod" >> $GITHUB_ENV
            echo "APP_SERVICE=prod_app" >> $GITHUB_ENV
          else
            echo "APP_ENV=dev" >> $GITHUB_ENV
            echo "APP_SERVICE=dev_app" >> $GITHUB_ENV
          fi

      - name: Deploy to Linode
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true)
        env:
          LINODE_INSTANCE_IP: ${{ secrets.LINODE_INSTANCE_IP }}
          GIT_HUB_USERNAME: ${{ secrets.GIT_HUB_USERNAME }}
          GIT_HUB_ACCESS_TOKEN: ${{ secrets.GIT_HUB_ACCESS_TOKEN }}
        run: |
            ssh -o StrictHostKeyChecking=no root@$LINODE_INSTANCE_IP "
              export APP_SERVICE=${{ env.APP_SERVICE }}
              export APP_DIR=${{ env.APP_DIR }}
              export COMPOSE_FILE=${{ env.COMPOSE_FILE }}
              export APP_ENV=${{ env.APP_ENV }}

              # 確保目標目錄存在
              mkdir -p \$APP_DIR
  
              # 檢查是否已經存在 Git 倉庫
              if [ -d \$APP_DIR/.git ]; then
                # 如果存在，更新現有倉庫
                cd \$APP_DIR
                git fetch --all
                git checkout ${{ github.ref_name }}
                git reset --hard origin/${{ github.ref_name }}
                git clean -fd
                DEPLOYMENT_TYPE='update'
                echo \"DEPLOYMENT_TYPE='update'\"
              else
                # 如果不存在，克隆倉庫
                git clone https://${{ env.GIT_HUB_USERNAME }}:${{ env.GIT_HUB_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git
                cd \$APP_DIR
                DEPLOYMENT_TYPE='initial'
                echo \"DEPLOYMENT_TYPE='initial'\"
              fi
  
              # 檢查並創建 .env 文件（如果不存在）
              if [ ! -f .env.\${APP_ENV} ]; then
                cp .env.\${APP_ENV}_temp .env.\${APP_ENV}
              fi
  
              set -o allexport && source .env.\${APP_ENV} && set +o allexport
              echo 'Environment variables loaded:'
  
              if [ \"\$DEPLOYMENT_TYPE\" = 'initial' ]; then
                echo \"Performing initial deployment...\"
                docker-compose --env-file .env.\${APP_ENV} -f \$COMPOSE_FILE up -d
              else
                echo \"Performing update deployment...\"
                docker-compose stop \$APP_SERVICE
                docker-compose rm -f \$APP_SERVICE
                docker ps -a
                docker container prune -f
                docker image prune -f
                docker network prune -f
                
                echo \"Updating specific services for \${APP_ENV} environment...\"

                docker-compose --env-file .env.\${APP_ENV} -f \$COMPOSE_FILE build --no-cache \$APP_SERVICE

                docker-compose --env-file .env.\${APP_ENV} -f \$COMPOSE_FILE up -d --no-deps \$APP_SERVICE

                
              fi
            "
  
  # Step 3: 驗證部署狀態
  verify:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LINODE_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LINODE_INSTANCE_IP }} >> ~/.ssh/known_hosts
    
      - name: Set Environment Variables
        run: |
          echo "APP_DIR=/root/daodao-server" >> $GITHUB_ENV
          echo "COMPOSE_FILE=docker-compose.yaml" >> $GITHUB_ENV
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "APP_ENV=prod" >> $GITHUB_ENV
            echo "APP_SERVICE=prod_app" >> $GITHUB_ENV
          else
            echo "APP_ENV=dev" >> $GITHUB_ENV
            echo "APP_SERVICE=dev_app" >> $GITHUB_ENV
          fi

      - name: Verify Deployment
        env:
          LINODE_INSTANCE_IP: ${{ secrets.LINODE_INSTANCE_IP }}
        run: |
          ssh root@$LINODE_INSTANCE_IP "
            echo '=== Checking Docker Containers ==='
            docker ps

            echo '=== Checking System Resources ==='
            echo 'CPU Load:' && uptime
            echo 'Memory Usage:' && free -h
            echo 'Disk Usage:' && df -h /

            echo '=== Checking Docker Networks ==='
            docker network ls

            echo '=== Checking Nginx Logs ==='
            cd ${{ env.APP_DIR }} && docker-compose -f ${{ env.COMPOSE_FILE }} logs --tail=20 nginx | tail -n 10

            echo '=== Checking Application Logs ==='
            cd ${{ env.APP_DIR }} && docker-compose -f ${{ env.COMPOSE_FILE }} logs --tail=20 ${{ env.APP_SERVICE }} | tail -n 10
          " 
  # Step 4: Discord 通知
  notify:
    needs: [test, verify]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Discord
        run: |
          if [ "${{ needs.test.result }}" == "failure" ]; then
            curl -X POST -H "Content-Type: application/json" \
              -d '{"content": "🚨 測試階段失敗！請檢查 GitHub Actions 記錄。", "embeds": [{"title": "Test Failure", "description": "Tests failed during execution", "color": 16711680}]}' \
              ${{ secrets.DISCORD_WEBHOOK_URL }}
          elif [ "${{ needs.verify.result }}" == "failure" ]; then
            curl -X POST -H "Content-Type: application/json" \
              -d '{"content": "🚨 部署失敗！請檢查 GitHub Actions 記錄。", "embeds": [{"title": "Deployment Failed", "description": "Error in the deployment process", "color": 16711680}]}' \
              ${{ secrets.DISCORD_WEBHOOK_URL }}
          else
            curl -X POST -H "Content-Type: application/json" \
              -d '{"content": "✅ SERVER部署成功！🎉", "embeds": [{"title": "Deployment Successful", "description": "All steps completed successfully", "color": 3066993}]}' \
              ${{ secrets.DISCORD_WEBHOOK_URL }}
          fi
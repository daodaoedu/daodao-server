name: Emergency Rebuild

# ===== 緊急重建工作流程 =====
# 目的：在快取問題導致構建異常時，提供強制重建選項
# 使用場景：
#   1. 類型變更後 Docker 快取導致的構建錯誤
#   2. 依賴更新後的快取不一致問題
#   3. 其他需要完全重新構建的情況
# 特點：
#   - 手動觸發
#   - 完全禁用所有快取
#   - 包含詳細的構建日誌
#   - 構建驗證
# ===============================

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要重建的分支'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - dev
      reason:
        description: '重建原因'
        required: true
        type: string
      skip_tests:
        description: '跳過測試 (僅緊急情況)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: 20
  DOCKER_BUILDKIT: 1

jobs:
  emergency-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.branch == 'main' && 'production' || 'development' }}
    
    steps:
      # ===== 準備工作 =====
      - name: Emergency rebuild preparation
        run: |
          echo "🚨 Emergency Rebuild Started"
          echo "Branch: ${{ inputs.branch }}"
          echo "Reason: ${{ inputs.reason }}"
          echo "Skip Tests: ${{ inputs.skip_tests }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Time: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0  # 完整歷史，用於分析

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      # ===== 強制清除所有快取 =====
      - name: Clear all caches
        run: |
          echo "🧹 Clearing all possible caches..."
          
          # 清除 pnpm 快取
          pnpm store prune || true
          
          # 清除 Docker 相關快取
          docker system prune -af || true
          docker builder prune -af || true
          
          echo "✅ Cache clearing completed"

      # ===== 依賴安裝 =====
      - name: Install dependencies (no cache)
        run: |
          echo "📦 Installing dependencies without cache..."
          pnpm install --frozen-lockfile --no-cache

      # ===== 類型生成 =====
      - name: Generate types
        run: |
          echo "🔧 Generating Prisma and OpenAPI types..."
          pnpm run types:generate

      # ===== 條件性測試 =====
      - name: Run tests and checks
        if: inputs.skip_tests == false
        run: |
          echo "🧪 Running quality checks..."
          pnpm run typecheck
          pnpm run lint
          pnpm test

      # ===== 設置環境變數 =====
      - name: Set environment variables
        run: |
          if [ "${{ inputs.branch }}" = "main" ]; then
            echo "IMAGE_TAG=prod" >> $GITHUB_ENV
            echo "NODE_ENV=prod" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
            echo "NODE_ENV=dev" >> $GITHUB_ENV
          fi

      # ===== Docker 構建設置 =====
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # ===== 強制重建 Docker 映像 =====
      - name: Build Docker image (no cache)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true  # 強制禁用快取
          pull: true      # 強制拉取最新基礎映像
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/app:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/app:${{ env.IMAGE_TAG }}-emergency-${{ github.sha }}
          build-args: |
            NODE_ENV=${{ env.NODE_ENV }}
          platforms: linux/amd64

      # ===== 構建驗證 =====
      - name: Verify emergency build
        run: |
          echo "🧪 Verifying emergency rebuild..."
          
          # 測試映像
          docker run --rm -d --name emergency-test \
            -p 3002:3000 \
            -e NODE_ENV=${{ env.NODE_ENV }} \
            ${{ secrets.DOCKER_HUB_USERNAME }}/app:${{ env.IMAGE_TAG }}-emergency-${{ github.sha }}
          
          sleep 15
          
          if docker ps | grep emergency-test; then
            echo "✅ Emergency build verification passed"
            
            # 健康檢查
            if curl -f http://localhost:3002/api/v1/health > /dev/null 2>&1; then
              echo "✅ Health check passed"
            else
              echo "⚠️  Health check failed"
            fi
          else
            echo "❌ Emergency build verification failed"
            docker logs emergency-test
            exit 1
          fi
          
          docker stop emergency-test || true

      # ===== 成功通知 =====
      - name: Send emergency rebuild success notification
        if: success()
        run: |
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ inputs.branch }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REASON="${{ inputs.reason }}"
          
          curl -X POST -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"color\": 16776960,
              \"thumbnail\": {
                \"url\": \"https://img.shields.io/badge/Emergency-Rebuild-yellow.png?style=for-the-badge&logo=github-actions&logoColor=white\"
              },
              \"fields\": [
                {\"name\": \"Branch\", \"value\": \"$BRANCH\", \"inline\": true},
                {\"name\": \"Triggered by\", \"value\": \"$AUTHOR\", \"inline\": true},
                {\"name\": \"Reason\", \"value\": \"$REASON\", \"inline\": false},
                {\"name\": \"Commit\", \"value\": \"[\`$SHORT_SHA\`](https://github.com/$REPO/commit/$COMMIT_SHA)\", \"inline\": false}
              ],
              \"timestamp\": \"$CURRENT_TIME\"
            }]
          }" ${{ secrets.DISCORD_WEBHOOK_URL }}

      # ===== 失敗通知 =====
      - name: Send emergency rebuild failure notification
        if: failure()
        run: |
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ inputs.branch }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REASON="${{ inputs.reason }}"
          
          curl -X POST -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"color\": 16711680,
              \"thumbnail\": {
                \"url\": \"https://img.shields.io/badge/Emergency-Failed-red.png?style=for-the-badge&logo=github-actions&logoColor=white\"
              },
              \"fields\": [
                {\"name\": \"Branch\", \"value\": \"$BRANCH\", \"inline\": true},
                {\"name\": \"Triggered by\", \"value\": \"$AUTHOR\", \"inline\": true},
                {\"name\": \"Reason\", \"value\": \"$REASON\", \"inline\": false},
                {\"name\": \"Commit\", \"value\": \"[\`$SHORT_SHA\`](https://github.com/$REPO/commit/$COMMIT_SHA)\", \"inline\": false}
              ],
              \"timestamp\": \"$CURRENT_TIME\"
            }]
          }" ${{ secrets.DISCORD_WEBHOOK_URL }}
openapi: 3.0.3
info:
  title: 道道平台訂閱制權限管理 API
  description: 整合訂閱制的權限管理系統 API 規範
  version: 1.0.0
  contact:
    name: 道道開發團隊
    email: dev@daodao.com

servers:
  - url: https://api.daodao.com/v1
    description: 生產環境
  - url: https://api-staging.daodao.com/v1
    description: 測試環境

paths:
  /subscription/plans:
    get:
      summary: 取得所有訂閱方案
      description: 回傳所有可用的訂閱方案及其功能詳情
      tags:
        - 訂閱管理
      responses:
        '200':
          description: 成功取得訂閱方案清單
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlansResponse'

  /subscription/current:
    get:
      summary: 取得目前訂閱狀態
      description: 回傳使用者目前的訂閱方案和使用量資訊
      tags:
        - 訂閱管理
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功取得訂閱狀態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSubscriptionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subscription/usage:
    get:
      summary: 取得使用量統計
      description: 回傳使用者各項功能的使用量和限制資訊
      tags:
        - 使用量管理
      security:
        - BearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [current, daily, monthly, yearly]
            default: current
          description: 統計周期
      responses:
        '200':
          description: 成功取得使用量統計
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageStatsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subscription/check-feature:
    post:
      summary: 檢查功能可用性
      description: 檢查使用者是否可以使用特定功能
      tags:
        - 功能檢查
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureCheckRequest'
      responses:
        '200':
          description: 功能檢查結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureCheckResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subscription/usage-log:
    post:
      summary: 記錄功能使用
      description: 記錄使用者的功能使用事件（內部 API）
      tags:
        - 使用量管理
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageLogRequest'
      responses:
        '201':
          description: 使用記錄建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /admin/subscription/plans:
    post:
      summary: 建立訂閱方案
      description: 管理員建立新的訂閱方案
      tags:
        - 訂閱管理
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionPlanRequest'
      responses:
        '201':
          description: 訂閱方案建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      summary: 管理員取得所有方案
      description: 管理員查看所有訂閱方案（包含非啟用的）
      tags:
        - 訂閱管理
      security:
        - BearerAuth: []
      parameters:
        - name: includeInactive
          in: query
          schema:
            type: boolean
            default: false
          description: 是否包含非啟用的方案
      responses:
        '200':
          description: 成功取得所有方案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSubscriptionPlansResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/subscription/plans/{planId}:
    put:
      summary: 更新訂閱方案
      description: 管理員更新訂閱方案資訊
      tags:
        - 訂閱管理
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionPlanRequest'
      responses:
        '200':
          description: 方案更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlanResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/subscription/usage-analytics:
    get:
      summary: 取得使用量分析
      description: 管理員查看平台使用量分析和統計
      tags:
        - 分析報告
      security:
        - BearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [daily, weekly, monthly, yearly]
            default: monthly
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: planId
          in: query
          schema:
            type: integer
          description: 篩選特定方案
      responses:
        '200':
          description: 成功取得使用量分析
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageAnalyticsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: 訂閱方案 ID

  schemas:
    # 基本回應格式
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          type: null
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
        timestamp:
          type: string
          format: date-time

    # 訂閱方案相關 Schema
    SubscriptionPlan:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        tier:
          type: string
          enum: [free, basic, premium, enterprise]
        description:
          type: string
        price:
          type: number
          format: decimal
        billingPeriod:
          type: string
          enum: [monthly, yearly]
        trialDays:
          type: integer
        features:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionFeature'
        isActive:
          type: boolean

    SubscriptionFeature:
      type: object
      properties:
        featureCode:
          type: string
        featureName:
          type: string
        description:
          type: string
        isEnabled:
          type: boolean
        limitValue:
          type: integer
          description: -1 表示無限制，null 表示不適用
        limitPeriod:
          type: string
          enum: [daily, monthly, yearly]
          nullable: true

    CurrentSubscription:
      type: object
      properties:
        plan:
          $ref: '#/components/schemas/SubscriptionPlan'
        status:
          type: string
          enum: [active, inactive, canceled, trial]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        daysRemaining:
          type: integer
        isTrialPeriod:
          type: boolean

    UsageStats:
      type: object
      properties:
        featureCode:
          type: string
        featureName:
          type: string
        currentUsage:
          type: integer
        limit:
          type: integer
          description: -1 表示無限制
        limitPeriod:
          type: string
          enum: [daily, monthly, yearly]
        resetDate:
          type: string
          format: date-time
        usagePercentage:
          type: number
          format: float
          description: 使用率百分比

    # API 回應 Schema
    SubscriptionPlansResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                plans:
                  type: array
                  items:
                    $ref: '#/components/schemas/SubscriptionPlan'

    CurrentSubscriptionResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CurrentSubscription'

    UsageStatsResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                period:
                  type: string
                features:
                  type: array
                  items:
                    $ref: '#/components/schemas/UsageStats'
                summary:
                  type: object
                  properties:
                    totalFeatures:
                      type: integer
                    featuresAtLimit:
                      type: integer
                    overallUsagePercentage:
                      type: number

    AdminSubscriptionPlansResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                plans:
                  type: array
                  items:
                    allOf:
                      - $ref: '#/components/schemas/SubscriptionPlan'
                      - type: object
                        properties:
                          subscriberCount:
                            type: integer
                          totalRevenue:
                            type: number
                          createdAt:
                            type: string
                            format: date-time
                          updatedAt:
                            type: string
                            format: date-time

    # 請求 Schema
    FeatureCheckRequest:
      type: object
      required:
        - featureCode
      properties:
        featureCode:
          type: string
          example: "project:create"
        increment:
          type: boolean
          default: false
          description: 是否增加使用量計數

    FeatureCheckResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                canUse:
                  type: boolean
                reason:
                  type: string
                  enum: [available, limit_exceeded, feature_disabled, subscription_required]
                currentUsage:
                  type: integer
                limit:
                  type: integer
                upgradeRequired:
                  type: string
                  description: 建議升級的方案等級

    UsageLogRequest:
      type: object
      required:
        - featureCode
        - actionType
      properties:
        featureCode:
          type: string
        actionType:
          type: string
          enum: [usage, limit_check, exceeded]
        resourceId:
          type: integer
        resourceType:
          type: string
        metadata:
          type: object

    CreateSubscriptionPlanRequest:
      type: object
      required:
        - name
        - tier
        - price
        - features
      properties:
        name:
          type: string
          maxLength: 100
        tier:
          type: string
          enum: [free, basic, premium, enterprise]
        description:
          type: string
        price:
          type: number
          format: decimal
          minimum: 0
        billingPeriod:
          type: string
          enum: [monthly, yearly]
          default: monthly
        trialDays:
          type: integer
          minimum: 0
          default: 0
        features:
          type: array
          items:
            type: object
            required:
              - featureCode
              - featureName
            properties:
              featureCode:
                type: string
              featureName:
                type: string
              description:
                type: string
              isEnabled:
                type: boolean
                default: true
              limitValue:
                type: integer
              limitPeriod:
                type: string
                enum: [daily, monthly, yearly]

    UpdateSubscriptionPlanRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
        price:
          type: number
          format: decimal
          minimum: 0
        isActive:
          type: boolean
        trialDays:
          type: integer
          minimum: 0
        features:
          type: array
          items:
            type: object
            properties:
              featureCode:
                type: string
              featureName:
                type: string
              description:
                type: string
              isEnabled:
                type: boolean
              limitValue:
                type: integer
              limitPeriod:
                type: string
                enum: [daily, monthly, yearly]

    SubscriptionPlanResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SubscriptionPlan'

    UsageAnalyticsResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                period:
                  type: string
                summary:
                  type: object
                  properties:
                    totalUsers:
                      type: integer
                    activeSubscriptions:
                      type: integer
                    totalRevenue:
                      type: number
                    averageUsageRate:
                      type: number
                planStats:
                  type: array
                  items:
                    type: object
                    properties:
                      planId:
                        type: integer
                      planName:
                        type: string
                      subscriberCount:
                        type: integer
                      revenue:
                        type: number
                      averageUsage:
                        type: number
                featureUsage:
                  type: array
                  items:
                    type: object
                    properties:
                      featureCode:
                        type: string
                      featureName:
                        type: string
                      totalUsage:
                        type: integer
                      uniqueUsers:
                        type: integer
                      averageUsagePerUser:
                        type: number

  responses:
    Unauthorized:
      description: 未授權存取
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: "UNAUTHORIZED"
              message: "請先登入"
            timestamp: "2024-09-21T10:00:00Z"

    Forbidden:
      description: 權限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: "FORBIDDEN"
              message: "需要管理員權限"
            timestamp: "2024-09-21T10:00:00Z"

    NotFound:
      description: 資源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: "NOT_FOUND"
              message: "訂閱方案不存在"
            timestamp: "2024-09-21T10:00:00Z"

    BadRequest:
      description: 請求參數錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: "BAD_REQUEST"
              message: "請求參數錯誤"
              details:
                field: "tier"
                message: "無效的訂閱等級"
            timestamp: "2024-09-21T10:00:00Z"

    RateLimitExceeded:
      description: 使用量限制exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: "USAGE_LIMIT_EXCEEDED"
              message: "已達到專案建立限制"
              details:
                featureCode: "project:create"
                currentUsage: 3
                limit: 3
                resetDate: "2024-10-01T00:00:00Z"
                upgradeRequired: "basic"
            timestamp: "2024-09-21T10:00:00Z"

tags:
  - name: 訂閱管理
    description: 訂閱方案和使用者訂閱管理
  - name: 使用量管理
    description: 功能使用量追蹤和限制
  - name: 功能檢查
    description: 功能可用性檢查
  - name: 分析報告
    description: 使用量分析和統計報告
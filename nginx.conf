user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log debug;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Cloudflare IP addresses
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    # Add more Cloudflare IP ranges as needed
    real_ip_header CF-Connecting-IP;

    server {
        listen 80;
        server_name dao-server.daoedu.tw server.daoedu.tw;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            if ($host = dao-server.daoedu.tw) {
                proxy_pass http://127.0.0.1:8080;
            }
            if ($host = server.daoedu.tw) {
                proxy_pass http://127.0.0.1:8081;
            }
        }
    }
    server {
        listen 8080;
        server_name dao-server.daoedu.tw;

        # Production environment
        location / {
            proxy_pass http://prod_app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_intercept_errors on;
            error_page 502 = @502;
        }

        # Custom 502 error page
        location @502 {
            default_type text/html;
            return 502 '<!DOCTYPE html>
<html>
<head><title>502 Bad Gateway</title></head>
<body>
<h1>502 Bad Gateway</h1>
<p>The server encountered a temporary error and could not complete your request.</p>
<p>Please try again in 30 seconds.</p>
</body>
</html>';
        }
    }

    # server.daoedu.tw
    server {
        listen 8081;
        server_name server.daoedu.tw;

        location / {
            proxy_pass http://dev_app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            proxy_intercept_errors on;
            error_page 502 = @502;
        }

        # Reuse the same custom 502 error page
        location @502 {
            default_type text/html;
            return 502 '<!DOCTYPE html>
<html>
<head><title>502 Bad Gateway</title></head>
<body>
<h1>502 Bad Gateway</h1>
<p>The server encountered a temporary error and could not complete your request.</p>
<p>Please try again in 30 seconds.</p>
</body>
</html>';
        }
    }

    # n8n HTTP 配置
    server {
        listen 80;
        server_name n8n.daoedu.tw;
    
        # 安全標頭
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
    
        # 主要位置配置
        location / {
            # 代理到 n8n 容器
            proxy_pass http://n8n:5678;
            
            # 基本代理標頭
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket 支援（n8n 需要）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            
            # 禁用緩衝（對 WebSocket 重要）
            proxy_buffering off;
            proxy_cache_bypass $http_upgrade;
            
            # 超時設置
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # 請求大小限制
            client_max_body_size 50M;
        }
    
        # n8n API 路由（重要！）
        location /rest/ {
            proxy_pass http://n8n:5678/rest/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 確保 API 請求不被緩存
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    
        # Webhook 路由
        location /webhook/ {
            proxy_pass http://n8n:5678/webhook/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_buffering off;
        }
    
        # 健康檢查
        location /healthz {
            proxy_pass http://n8n:5678/healthz;
            proxy_set_header Host $host;
            access_log off;
        }
    
        # 靜態資源快取
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            proxy_pass http://n8n:5678;
            proxy_set_header Host $host;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }
    
        # 阻止訪問敏感文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    
        # 錯誤頁面
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
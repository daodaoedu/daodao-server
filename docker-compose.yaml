
services:
  prod_app:
    image: ${DOCKER_HUB_USERNAME}/app:${IMAGE_TAG:-prod}${COMMIT_SHA:+-}${COMMIT_SHA}
    env_file:
      - .env.prod
    # 禁用 Docker 日誌捕獲
    logging:
      driver: "none"
    networks:
      - prod-daodao-network
      - prod_network
    # 掛載日誌目錄到宿主機
    volumes:
      - ./logs:/app/logs
    depends_on:
      # MongoDB 現在是可選的，不等待健康檢查
      mongo_prod:
        condition: service_started
      # Redis 仍然是必須的（核心業務邏輯依賴）
      redis_prod:
        condition: service_healthy
    # 健康檢查配置 - 必須明確定義才能讓 docker compose --wait 生效
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  production_app:
    image: ${DOCKER_HUB_USERNAME}/app:${IMAGE_TAG:-production}${COMMIT_SHA:+-}${COMMIT_SHA}
    env_file:
      - .env.prod
    logging:
      driver: "none"
    networks:
      - prod-daodao-network
      - prod_network
    volumes:
      - ./logs:/app/logs
    depends_on:
      mongo_prod:
        condition: service_started
      redis_prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  dev_app:
    image: ${DOCKER_HUB_USERNAME}/app:${IMAGE_TAG:-dev}${COMMIT_SHA:+-}${COMMIT_SHA}
    env_file:
      - .env.dev
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs  # 掛載日誌目錄（Winston 會自動創建 dev 子資料夾）
    # 開發環境可保留最小日誌用於調試
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      - dev-daodao-network
      - dev_network
    depends_on:
      # MongoDB 現在是可選的，不等待健康檢查
      mongo_dev:
        condition: service_started
      # Redis 仍然是必須的（核心業務邏輯依賴）
      redis_dev:
        condition: service_healthy
    # 健康檢查配置 - 必須明確定義才能讓 docker compose --wait 生效
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  mongo_prod:
    image: mongo:4.4
    container_name: mongo_prod
    volumes:
      - mongo_prod_data:/data/db
    networks:
      - prod-daodao-network
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5

  mongo_dev:
    image: mongo:4.4
    container_name: mongo_dev
    volumes:
      - mongo_dev_data:/data/db
    networks:
      - dev-daodao-network
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5

  redis_prod:
    image: redis:6
    container_name: redis_prod
    volumes:
      - redis_prod_data:/data
    networks:
      - prod-daodao-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_dev:
    image: redis:6
    container_name: redis_dev
    volumes:
      - redis_dev_data:/data
    networks:
      - dev-daodao-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    environment:
      - APP_ENV=${APP_ENV}
    depends_on:
      - prod_app
      - production_app
      - dev_app
    networks:
      - prod-daodao-network
      - dev-daodao-network

volumes:
  mongo_prod_data:
  mongo_dev_data:
  redis_prod_data:
  redis_dev_data:

networks:
  prod-daodao-network:
    external: true
  dev-daodao-network:
    external: true
  dev_network:
  prod_network:


# ===== 共用配置模板 =====
# 注意：depends_on 不包含在此模板中，因為 YAML merge 會合併而非覆蓋 map
# prod_app 使用 redis_prod，production_app 使用 redis_production
x-prod-app-base: &prod-app-base
  restart: unless-stopped
  env_file:
    - .env.prod
  # 禁用 Docker 日誌捕獲（應用程式透過 Winston 寫入掛載的 logs 目錄）
  logging:
    driver: "none"
  networks:
    - prod-daodao-network
    - prod_network
  # 健康檢查配置 - 必須明確定義才能讓 docker compose --wait 生效
  healthcheck:
    test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 30s

services:
  prod_app:
    <<: *prod-app-base
    volumes:
      - type: bind
        source: ${DAODAO_LOG_ROOT:-/var/log/daodao-server}/prod
        target: /app/logs
        bind:
          create_host_path: false
    image: ${DOCKER_HUB_USERNAME}/app:${IMAGE_TAG:-prod}${COMMIT_SHA:+-}${COMMIT_SHA}
    networks:
      prod-daodao-network:
        aliases:
          - prod_app
      prod_network:
    depends_on:
      redis_prod:
        condition: service_healthy

  production_app:
    <<: *prod-app-base
    volumes:
      - type: bind
        source: ${DAODAO_LOG_ROOT:-/var/log/daodao-server}/production
        target: /app/logs
        bind:
          create_host_path: false
    image: ${DOCKER_HUB_USERNAME}/app:${IMAGE_TAG:-production}${COMMIT_SHA:+-}${COMMIT_SHA}
    networks:
      prod-daodao-network:
        aliases:
          - production_app
      prod_network:
    depends_on:
      redis_production:
        condition: service_healthy

  dev_app:
    image: ${DOCKER_HUB_USERNAME}/app:${IMAGE_TAG:-dev}${COMMIT_SHA:+-}${COMMIT_SHA}
    restart: unless-stopped
    env_file:
      - .env.dev
    volumes:
      - ./src:/app/src
      - ${DAODAO_LOG_ROOT:-/var/log/daodao-server}/dev:/app/logs
    # 開發環境可保留最小日誌用於調試
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      dev-daodao-network:
        aliases:
          - dev_app
      dev_network:
    depends_on:
      # Redis 是必須的（核心業務邏輯依賴）
      redis_dev:
        condition: service_healthy
    # 健康檢查配置 - 必須明確定義才能讓 docker compose --wait 生效
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis_prod:
    image: redis:6
    container_name: redis_prod
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    networks:
      - prod-daodao-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_production:
    image: redis:6
    container_name: redis_production
    restart: unless-stopped
    volumes:
      - redis_production_data:/data
    networks:
      - prod-daodao-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_dev:
    image: redis:6
    container_name: redis_dev
    restart: unless-stopped
    volumes:
      - redis_dev_data:/data
    networks:
      - dev-daodao-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    environment:
      - APP_ENV=${APP_ENV}
    depends_on:
      - prod_app
      - production_app
      - dev_app
    networks:
      - prod-daodao-network
      - dev-daodao-network

volumes:
  redis_prod_data:
  redis_production_data:
  redis_dev_data:

networks:
  prod-daodao-network:
    external: true
  dev-daodao-network:
    external: true
  dev_network:
  prod_network:


# ===== 共用配置模板 =====
# 注意：depends_on 不包含在此模板中，因為 YAML merge 會合併而非覆蓋 map
# prod_app 使用 redis_prod，production_app 使用 redis_production
x-prod-app-base: &prod-app-base
  env_file:
    - .env.prod
  # 禁用 Docker 日誌捕獲（應用程式透過 Winston 寫入掛載的 logs 目錄）
  logging:
    driver: "none"
  networks:
    - prod-daodao-network
    - prod_network
  volumes:
    - ./logs:/app/logs
  # 健康檢查配置 - 必須明確定義才能讓 docker compose --wait 生效
  healthcheck:
    test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 30s
  deploy:
    resources:
      limits:
        memory: 1G
        cpus: "1.0"

services:
  prod_app:
    <<: *prod-app-base
    image: ${DOCKER_HUB_USERNAME}/app:${IMAGE_TAG:-prod}${COMMIT_SHA:+-}${COMMIT_SHA}
    networks:
      prod-daodao-network:
        aliases:
          - prod_app
      prod_network:
    depends_on:
      redis_prod:
        condition: service_healthy

  production_app:
    <<: *prod-app-base
    image: ${DOCKER_HUB_USERNAME}/app:${IMAGE_TAG:-production}${COMMIT_SHA:+-}${COMMIT_SHA}
    env_file:
      - .env.production
    networks:
      prod-daodao-network:
        aliases:
          - production_app
      prod_network:
    depends_on:
      redis_production:
        condition: service_healthy

  dev_app:
    image: ${DOCKER_HUB_USERNAME}/app:${IMAGE_TAG:-dev}${COMMIT_SHA:+-}${COMMIT_SHA}
    env_file:
      - .env.dev
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs  # 掛載日誌目錄（Winston 會自動創建 dev 子資料夾）
    # 開發環境可保留最小日誌用於調試
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      dev-daodao-network:
        aliases:
          - dev_app
      dev_network:
    depends_on:
      # Redis 是必須的（核心業務邏輯依賴）
      redis_dev:
        condition: service_healthy
    # 健康檢查配置 - 必須明確定義才能讓 docker compose --wait 生效
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  redis_prod:
    image: redis:6.2.16-alpine
    container_name: redis_prod
    volumes:
      - redis_prod_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - prod-daodao-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  redis_production:
    image: redis:6.2.16-alpine
    container_name: redis_production
    volumes:
      - redis_production_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - prod-daodao-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  redis_dev:
    image: redis:6.2.16-alpine
    container_name: redis_dev
    volumes:
      - redis_dev_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"
    networks:
      - dev-daodao-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    environment:
      - APP_ENV=${APP_ENV}
    depends_on:
      - prod_app
      - production_app
      - dev_app
    networks:
      - prod-daodao-network
      - dev-daodao-network

volumes:
  redis_prod_data:
  redis_production_data:
  redis_dev_data:

networks:
  prod-daodao-network:
    external: true
  dev-daodao-network:
    external: true
  dev_network:
  prod_network:

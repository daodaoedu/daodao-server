version: '3.8'
services:
  prod_app:
    image: ${DOCKER_HUB_USERNAME}/app:prod
    container_name: prod_app
    env_file:
      - .env.prod
    # 禁用 Docker 日誌捕獲
    logging:
      driver: "none"
    networks:
      - prod_network
    # 掛載日誌目錄到宿主機
    volumes:
      - ./logs:/app/logs
    depends_on:
      mongo_prod:
        condition: service_healthy
      redis_prod:
        condition: service_healthy
      postgres-prod:
        condition: service_healthy

  dev_app:
    image: ${DOCKER_HUB_USERNAME}/app:dev
    container_name: dev_app
    env_file:
      - .env.dev
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs  # 掛載日誌目錄
    # 開發環境可保留最小日誌用於調試
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      - dev_network
    depends_on:
      mongo_dev:
        condition: service_healthy
      redis_dev:
        condition: service_healthy
      postgres-dev:
        condition: service_healthy

  postgres-dev:
    image: postgres:14
    container_name: postgres-dev
    environment:
      POSTGRES_USER: daodao
      POSTGRES_PASSWORD: daodao
      POSTGRES_DB: daodao
    networks:
      - dev_network
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U daodao -d daodao" ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-prod:
    image: postgres:14
    container_name: postgres-prod
    environment:
      POSTGRES_USER: daodao
      POSTGRES_PASSWORD: daodao
      POSTGRES_DB: daodao
    networks:
      - prod_network
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U daodao -d daodao" ]
      interval: 5s
      timeout: 5s
      retries: 10
  
  mongo_prod:
    image: mongo:4.4
    container_name: mongo_prod
    volumes:
      - mongo_prod_data:/data/db
    networks:
      - prod_network
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5

  mongo_dev:
    image: mongo:4.4
    container_name: mongo_dev
    volumes:
      - mongo_dev_data:/data/db
    networks:
      - dev_network
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5

  redis_prod:
    image: redis:6
    container_name: redis_prod
    volumes:
      - redis_prod_data:/data
    networks:
      - prod_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_dev:
    image: redis:6
    container_name: redis_dev
    volumes:
      - redis_dev_data:/data
    networks:
      - dev_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    environment:
      - APP_ENV=${APP_ENV}
    depends_on:
      - prod_app
      - dev_app
    networks:
      - prod_network
      - dev_network

volumes:
  mongo_prod_data:
  mongo_dev_data:
  redis_prod_data:
  redis_dev_data:
  postgres-dev-data:
  postgres-prod-data:

networks:
  prod_network:
    driver: bridge
  dev_network:
    driver: bridge
